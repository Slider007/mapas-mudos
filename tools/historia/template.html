<!doctype html>
<html lang="es" data-theme="light" style="color-scheme:light">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__TITLE__</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9B%AA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f2f45;--ink2:#5b6b80;--bg:#f7f5fb;--panel:#fff;--soft:#efeaf7;--line:#d9cfea;--biz:#7e57c2;--biz2:#5e35b1;--gold:#c9a227;--ok:#2f8f5b;--bad:#d1432f;--hi:#f2a516;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
.app{max-width:980px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 14px 40px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:4px 0 8px}
.home{color:var(--ink2);text-decoration:none;font-size:.85rem;font-weight:600;border:1.5px solid var(--ink2);border-radius:99px;padding:3px 10px}
.home:hover{color:var(--ink);border-color:var(--ink)}
h1{flex:0 0 100%;order:3;margin:2px 0 0;font-size:1.5rem;font-weight:800;letter-spacing:-.01em;line-height:1.15}
h1 small{display:block;font-size:.85rem;font-weight:400;color:var(--ink2)}
.tools{margin-left:auto;display:flex;gap:6px;align-items:center}
.tog{display:flex;gap:5px;align-items:center;font-size:.82rem;color:var(--ink2);cursor:pointer;border:1.5px solid var(--line);border-radius:99px;padding:3px 10px;background:var(--panel)}
.pdf{font-size:.82rem;font-weight:700;text-decoration:none;color:#fff;background:var(--biz);border-radius:99px;padding:5px 12px}
.steps{display:flex;gap:6px;overflow-x:auto;padding:6px 0 10px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.steps button{flex:none;border:1.5px solid var(--line);background:var(--panel);border-radius:14px;padding:7px 11px;font-weight:700;font-size:.86rem;cursor:pointer;white-space:nowrap}
.steps button[aria-pressed=true]{background:var(--biz);border-color:var(--biz);color:#fff}
.steps button .ck{color:var(--ok);margin-left:4px}
.steps button[aria-pressed=true] .ck{color:#d6f5e2}
.prog{height:6px;border-radius:9px;background:var(--soft);overflow:hidden;margin:0 0 12px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--biz),var(--gold));transition:width .4s}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:16px 18px;margin:0 0 12px}
h2{margin:0 0 6px;font-size:1.2rem}
h3{margin:0 0 4px;font-size:1.05rem}
.muted{color:var(--ink2);font-size:.9rem}
.ru{color:#6a4fa3;font-size:.9rem;background:#f4effc;border-left:3px solid #b9a3e3;padding:6px 10px;border-radius:0 10px 10px 0;margin:8px 0 0}
body.noru .ru{display:none}
.pts{margin:6px 0 0;padding:0;list-style:none}
.pts li{margin:6px 0}
.key{margin-top:10px;font-size:.88rem;background:#fff8e1;border:1px solid #f0dd9c;border-radius:12px;padding:7px 10px}
.key b{color:#8a6d00}
details.sec{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;margin:0 0 10px;overflow:hidden}
details.sec summary{list-style:none;cursor:pointer;padding:13px 16px;font-weight:800;display:flex;gap:10px;align-items:center}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary .st{margin-left:auto;font-size:.8rem;font-weight:700;color:var(--ink2)}
details.sec summary .st.ok{color:var(--ok)}
details.sec .body{padding:0 16px 14px}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--biz);color:#fff}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.ok{background:var(--ok)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.chip{border:1.5px solid var(--line);background:var(--panel);border-radius:99px;padding:4px 11px;font-size:.84rem;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.opts{display:grid;gap:8px;margin-top:10px}
.opts button{text-align:left;border:1.5px solid var(--line);background:var(--panel);border-radius:12px;padding:11px 12px;cursor:pointer;font-weight:600}
.opts button:hover:not(:disabled){border-color:var(--biz)}
.opts button.ok{border-color:var(--ok);background:#e6f4ec}
.opts button.bad{border-color:var(--bad);background:#fbe9e6}
.fb{margin-top:10px;font-weight:700}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.expl{margin-top:6px;font-size:.92rem;color:var(--ink2)}
.score{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:.86rem}
.q{font-size:1.15rem;font-weight:800;margin:4px 0}
/* timeline */
.tl{position:relative;margin:8px 0 0;padding-left:22px}
.tl:before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:3px;background:linear-gradient(var(--biz),var(--gold));border-radius:3px}
.tli{position:relative;margin:0 0 10px}
.tli:before{content:"";position:absolute;left:-19px;top:6px;width:11px;height:11px;border-radius:50%;background:#fff;border:3px solid var(--biz)}
.tli.core:before{background:var(--gold);border-color:var(--gold)}
.tli b{display:inline-block;min-width:52px;font-variant-numeric:tabular-nums}
.ord{display:grid;gap:8px;margin-top:10px}
.ord button{text-align:left;border:1.5px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 12px;cursor:pointer;font-weight:600}
.ord button.done{background:#e6f4ec;border-color:var(--ok)}
.ord button.bad{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
input.yr{width:110px;font-size:1.2rem;padding:8px 10px;border-radius:12px;border:1.5px solid var(--line)}
/* map */
.mapwrap{position:relative;border-radius:16px;overflow:hidden;background:#cfe1e8;border:1.5px solid var(--line);touch-action:manipulation}
svg#map{display:block;width:100%;height:auto;cursor:crosshair}
.mm{margin:12px 0 6px}.mmw{border-radius:12px;overflow:hidden;background:#cfe1e8;border:1.5px solid var(--line)}
svg.mini{display:block;width:100%;height:auto}.mm figcaption{font-size:.88rem;color:var(--ink2);margin-top:6px}
.mm .mleg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.8rem;margin-top:4px}.mm .mleg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid #999}
@media(max-width:640px){.mapwrap{margin:0 -31px;border-radius:0;border-left:0;border-right:0}}
.land{fill:#f3eee0;stroke:#c9bfa6;stroke-width:.6;vector-effect:non-scaling-stroke}
.biz{fill:#7e57c2;fill-opacity:.42;stroke:#5e35b1;stroke-width:1}
.oto{fill:#00897b;fill-opacity:.35;stroke:#00695c;stroke-width:1}
.city circle{fill:#7a2e2e;stroke:#fff;stroke-width:1.2}
.city text{font-size:11px;font-weight:700;fill:#2b2b2b;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.zb{position:absolute;right:8px;top:8px;display:grid;gap:5px}.zb button{width:34px;height:34px;border-radius:10px;border:0;background:#fff;box-shadow:0 0 0 1px #c9bfa6;font-size:1.1rem;cursor:pointer}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:.82rem;margin-top:6px}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
/* pyramid */
.pyr{display:grid;gap:6px;margin:10px auto;max-width:560px}
.lvl{border:2px dashed var(--line);border-radius:12px;padding:8px;min-height:52px;text-align:center;cursor:pointer;background:var(--panel)}
.lvl.sel{border-color:var(--biz);background:#f4effc}
.lvl h4{margin:0 0 4px;font-size:.8rem;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
.lvl .in{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.tag{border:1.5px solid var(--ink2);background:#fff;border-radius:99px;padding:4px 10px;font-size:.84rem;cursor:pointer;font-weight:600}
.tag.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.tag.ok{border-color:var(--ok);background:#e6f4ec}
.tag.bad{border-color:var(--bad);background:#fbe9e6}
.pool{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
/* flashcards */
.fc{width:100%;min-height:190px;border:2px solid var(--line);border-radius:18px;background:linear-gradient(160deg,#fff,#f6f1ff);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;cursor:pointer;gap:6px}
.fc .t{font-size:1.6rem;font-weight:800;color:var(--biz2)}
.fc .d{font-size:1.05rem;font-weight:600}
/* open */
textarea{width:100%;min-height:120px;border:1.5px solid var(--line);border-radius:12px;padding:10px;resize:vertical}
.model{background:#f1f8f4;border:1.5px solid #bfe3cd;border-radius:12px;padding:10px 12px;margin-top:10px}
.kw label{display:flex;gap:8px;align-items:flex-start;margin:5px 0;cursor:pointer}
/* exam */
.big{font-size:2.6rem;font-weight:800;color:var(--biz2);line-height:1}
.res li{margin:6px 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.stat{background:var(--soft);border-radius:14px;padding:10px 12px}
.stat b{font-size:1.4rem;display:block}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:8px 16px;border-radius:12px;font-weight:700;transition:transform .25s;z-index:9}
.toast.on{transform:translateX(-50%) translateY(0)}
footer{margin-top:20px;font-size:.75rem;color:var(--ink2)}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
</style>
</head>
<body>
<div class="app">
<header>
 <a class="home" href="../">← <span data-es="Lecciones" data-ru="Уроки">Lecciones</span></a>
 <h1>__H1__<small>__SUB__</small></h1>
 <div class="tools">
  <label class="tog"><input type="checkbox" id="rut"> RU</label>
 </div>
</header>
<nav class="steps" id="steps"></nav>
<div class="prog"><i id="pbar" style="width:0"></i></div>
<main id="main"></main>
<footer>__FOOTER__</footer>
</div>
<div class="toast" id="toast"></div>
<script>
const D=__DATA__;
const G=__GEO__;
const $=s=>document.querySelector(s);
const LS={get(k,d){try{const v=localStorage.getItem('__LSP__'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('__LSP__'+k,JSON.stringify(v))}catch(e){}}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastT;function toast(t){const n=$('#toast');n.textContent=t;n.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>n.classList.remove('on'),1700)}
const TOPICS=D.topics;

/* -------- state -------- */
let P=LS.get('p',{read:{},tl:false,map:false,pyr:false,cards:{},quiz:{},open:{},best:null});
const save=()=>{LS.set('p',P);renderSteps()};
const STEPS=[
 ['learn','📖 1. Aprender','Учить материал'],
 ['tl','📅 2. Línea del tiempo','Даты'],
 ['map','🗺 3. Mapa','Карта'],
 ['pyr','🔺 4. Pirámide','Пирамида общества'],
 ['cards','🃏 5. Tarjetas','Карточки'],
 ['quiz','✅ 6. Test','Тест по темам'],
 ['open','✍️ 7. Preguntas largas','Развёрнутые ответы'],
 ['exam','🎯 8. Examen','Итоговый экзамен'],
];
function doneStep(id){
 if(id==='learn')return D.sections.every(s=>P.read[s.id]);
 if(id==='tl')return P.tl;if(id==='map')return P.map;if(id==='pyr')return P.pyr;
 if(id==='cards')return D.cards.filter(c=>(P.cards[c[0]]||0)>=2).length>=D.cards.length*0.8;
 if(id==='quiz')return Object.values(P.quiz).filter(v=>v===true).length>=D.quiz.length*0.8;
 if(id==='open')return Object.keys(P.open).length>=D.open.length*0.7;
 if(id==='exam')return P.best!=null&&P.best>=7;
}
let cur=LS.get('step','learn');
function renderSteps(){
 $('#steps').innerHTML=STEPS.map(s=>`<button data-s="${s[0]}" aria-pressed="${cur===s[0]}" title="${s[2]}">${s[1]}${doneStep(s[0])?'<span class="ck">✓</span>':''}</button>`).join('');
 const n=STEPS.filter(s=>doneStep(s[0])).length;$('#pbar').style.width=(n/STEPS.length*100)+'%';
}
$('#steps').onclick=e=>{const b=e.target.closest('[data-s]');if(b)go(b.dataset.s)};
function go(s){cur=s;LS.set('step',s);renderSteps();({learn,tl,map,pyr,cards,quiz,open:largas,exam})[s]();window.scrollTo({top:0,behavior:'smooth'})}
$('#rut').checked=LS.get('ru',false);document.body.classList.toggle('noru',!$('#rut').checked);
$('#rut').onchange=e=>{LS.set('ru',e.target.checked);document.body.classList.toggle('noru',!e.target.checked)};
const nextBtn=(s,lab)=>`<div class="row"><button class="btn" onclick="go('${s}')">${lab} →</button></div>`;

/* -------- 1. learn -------- */
function learn(){
 const r=D.sections.filter(s=>P.read[s.id]).length;
 $('#main').innerHTML=(D.sections.some(s=>s.map)?`<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><path id="LANDP" d="${G.land}" vector-effect="non-scaling-stroke"/><clipPath id="LANDC"><use href="#LANDP"/></clipPath></defs></svg>`:'')+`<div class="card"><h2>📖 Aprender</h2><p class="muted">Lee cada apartado, mira la línea «Recuerda» y marca «Lo he leído». Leído: <b>${r} / ${D.sections.length}</b>.</p><div class="ru">Прочитай каждый раздел (по-испански; перевод — фиолетовым), запомни строку «Recuerda» и нажми «Lo he leído».</div></div>`+
 D.sections.map((s,i)=>`<details class="sec" ${!P.read[s.id]&&i===D.sections.findIndex(x=>!P.read[x.id])?'open':''}><summary>${s.t}<span class="st ${P.read[s.id]?'ok':''}">${P.read[s.id]?'✓ leído':'por leer'}</span></summary><div class="body"><div class="ru" style="margin:0 0 6px">${s.tr}</div><ul class="pts">${s.pts.map(p=>`<li>${p}</li>`).join('')}</ul>${s.map?miniFig(s.map,i):''}<div class="key"><b>Recuerda:</b> ${s.key}</div><div class="ru">${s.ru}</div><div class="row"><button class="btn ${P.read[s.id]?'ghost':''}" data-read="${s.id}">${P.read[s.id]?'Leído ✓':'Lo he leído'}</button></div></div></details>`).join('')+
 nextBtn('tl','Siguiente: línea del tiempo');
 $('#main').querySelectorAll('[data-read]').forEach(b=>b.onclick=()=>{P.read[b.dataset.read]=true;save();learn()});
 $('#main').querySelectorAll('details.sec').forEach(d=>d.addEventListener('toggle',sizeMinis));sizeMinis();
}

/* mini-mapas de cada apartado: qué pasa y dónde */
function miniFig(mm,uid){
 const sw=(fill)=>fill==='#hd'?'repeating-linear-gradient(135deg,#333 0 1px,#fff 1px 5px)':fill;
 return `<figure class="mm"><div class="mmw">${miniMap(mm,uid)}</div><figcaption>${mm.leg?`<div class="mleg">${mm.leg.map(([f,t])=>`<span><i style="background:${sw(f)}"></i>${t}</span>`).join('')}</div>`:''}<div style="margin-top:4px">${mm.cap}</div>${mm.cap_ru?`<div class="ru">${mm.cap_ru}</div>`:''}</figcaption></figure>`}
function miniMap(mm,uid){
 const vb=mm.vb,P=(lo,la)=>prj(lo,la),f=v=>v.toFixed(2);
 const T=(x,y,t,fs,st,anchor='middle',dx=0,dy=0,sw=3)=>`<text data-fs="${fs}" data-x="${f(x)}" data-y="${f(y)}" data-dx="${dx}" data-dy="${dy}" data-sw="${sw}" x="${f(x)}" y="${f(y)}" text-anchor="${anchor}" style="${st}">${t}</text>`;
 let h=`<svg class="mini" viewBox="${vb.join(' ')}" data-w="${vb[2]}" role="img" aria-label="${(mm.cap||'').replace(/<[^>]+>/g,'').replace(/"/g,'')}"><defs><pattern id="hd${uid}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45) scale(${f(vb[2]/560)})"><line x1="0" y1="0" x2="0" y2="6" stroke="#333" stroke-width="1.1"/></pattern></defs>
 <use href="#LANDP" class="land"/><g clip-path="url(#LANDC)">`;
 for(const [rings,fill,op] of mm.regs||[])for(const pl of rings)h+=`<path d="${poly(pl)}" fill="${fill==='#hd'?`url(#hd${uid})`:fill}" fill-opacity="${op==null?.8:op}" stroke="${fill==='#hd'?'none':'#9a8a6a'}" stroke-width=".6" vector-effect="non-scaling-stroke"/>`;
 h+=`</g><path d="${G.rivers}" fill="none" stroke="#4f8fb8" stroke-width=".9" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`;
 for(const r of mm.lines||[]){const d=line(r.pts),col=r.col||'#c62828';
  h+=`<path d="${d}" fill="none" stroke="#fff" data-lw="5.5" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/><path d="${d}" fill="none" stroke="${col}" data-lw="2.4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" ${r.dash?'data-dash="6 4" stroke-dasharray="6 4"':''}/>`;
  if(!r.noarrow){const n=r.pts.length,a=P(...r.pts[n-2]),b=P(...r.pts[n-1]),ang=Math.atan2(b[1]-a[1],b[0]-a[0])*180/Math.PI;
   h+=`<path data-as="1" data-tx="${f(b[0])}" data-ty="${f(b[1])}" data-rot="${f(ang)}" d="M-4.5,-4.6 L3.2,0 L-4.5,4.6 L-2.6,0Z" fill="${col}" stroke="#fff" stroke-width=".25" transform="translate(${f(b[0])},${f(b[1])}) rotate(${f(ang)})"/>`}
  if(r.label){const [x,y]=P(...(r.lab||r.pts[Math.floor(r.pts.length/2)]));h+=T(x,y,r.label,10,`font-weight:800;fill:${col};paint-order:stroke;stroke:#fff`)}}
 for(const [t,lo,la,st] of mm.labels||[]){const [x,y]=P(lo,la);
  const S={sea:[9.5,'font-style:italic;fill:#2f6f9a;paint-order:stroke;stroke:#cfe1e8'],big:[10.5,'font-weight:800;letter-spacing:.05em;fill:#444;paint-order:stroke;stroke:rgba(255,255,255,.9)'],note:[9,'fill:#333;paint-order:stroke;stroke:#fff']}[st]||[10,`font-weight:800;fill:${st||'#333'};paint-order:stroke;stroke:#fff`];
  h+=T(x,y,t,S[0],S[1])}
 for(const [n,lo,la,side] of mm.pts||[]){const [x,y]=P(lo,la),[an,dx,dy]={w:['end',-5,-4],n:['middle',0,-7],s:['middle',0,15]}[side]||['start',5,-4];
  h+=`<circle data-r="3.4" cx="${f(x)}" cy="${f(y)}" r="3.4" fill="#7a2e2e" stroke="#fff" data-lw="1.2" stroke-width="1.2"/>`+T(x,y,n,10.5,'font-weight:700;fill:#222;paint-order:stroke;stroke:#fff;stroke-linejoin:round',an,dx,dy)}
 return h+'</svg>'}
function sizeMinis(){document.querySelectorAll('svg.mini').forEach(s=>{const w=s.clientWidth;if(!w)return;const u=+s.dataset.w/w;
 s.querySelectorAll('[data-fs]').forEach(t=>{t.style.fontSize=(t.dataset.fs*u)+'px';t.style.strokeWidth=(t.dataset.sw*u)+'px';t.setAttribute('x',+t.dataset.x+t.dataset.dx*u);t.setAttribute('y',+t.dataset.y+t.dataset.dy*u)});
 s.querySelectorAll('[data-r]').forEach(c=>c.setAttribute('r',c.dataset.r*u));
 s.querySelectorAll('[data-lw]').forEach(p=>p.setAttribute('stroke-width',p.dataset.lw*u));
 s.querySelectorAll('[data-dash]').forEach(p=>p.setAttribute('stroke-dasharray',p.dataset.dash.split(' ').map(v=>v*u).join(' ')));
 s.querySelectorAll('[data-as]').forEach(a=>a.setAttribute('transform',`translate(${a.dataset.tx},${a.dataset.ty}) rotate(${a.dataset.rot}) scale(${u})`))})}
window.addEventListener('resize',sizeMinis);

/* -------- 2. timeline -------- */
let TLm='ver';
function tl(){
 const chips=`<div class="chips">${[['ver','Ver'],['ord','Ordenar'],['yr','¿Qué año?']].map(m=>`<button class="chip" data-m="${m[0]}" aria-pressed="${TLm===m[0]}">${m[1]}</button>`).join('')}</div>`;
 let h=`<div class="card"><h2>📅 Línea del tiempo</h2><p class="muted">Las fechas en dorado son las de la línea del tiempo del libro (p. 22): se aprenden de memoria.</p>${chips}<div id="tlb"></div></div>`;

/* -------- 3. maps (datos en D.maps: capas, regiones, rutas, ciudades y preguntas) -------- */
const prj=(lon,lat)=>[(lon-G.LON0)*G.C*G.K,(G.LAT1-lat)*G.K];
let MI=0,VB=D.maps[0].vb;const M=()=>D.maps[MI];
function setMap(i){MI=i;VB=M().vb;MV=null}
const mapOnAll=LS.get('maplayers',{});const mapOn=id=>{const m=mapOnAll[M().id]||{};return m[id]!==0};
let mapQ=null,mapStats={ok:0,n:0},mapMode='ver';
const poly=pl=>'M'+pl.map(([lo,la])=>prj(lo,la).map(v=>v.toFixed(1)).join(',')).join('L')+'Z';
const line=pl=>'M'+pl.map(([lo,la])=>prj(lo,la).map(v=>v.toFixed(1)).join(',')).join('L');
const inPoly=(pt,pl)=>{let c=false;for(let i=0,j=pl.length-1;i<pl.length;j=i++){const [xi,yi]=prj(...pl[i]),[xj,yj]=prj(...pl[j]);if((yi>pt[1])!==(yj>pt[1])&&pt[0]<(xj-xi)*(pt[1]-yi)/(yj-yi)+xi)c=!c}return c};
const regHit=(ids,p)=>ids.some(id=>(M().regions[id]||[]).some(pl=>inPoly(p,pl)));
function tqOk(tq,p){if(tq.near){const c=prj(tq.near[0],tq.near[1]);if(Math.hypot(p[0]-c[0],p[1]-c[1])<tq.near[2])return true}return regHit(tq.in||[],p)&&!regHit(tq.notin||[],p)}
function terrHit(p,tq){ // допуск ~10 экранных пикселей: узкие полосы трудно попасть пальцем
 const svg=$('#map');const upp=MV.w/svg.getBoundingClientRect().width;const r=10*upp;
 const pts=[[0,0]];for(let k=0;k<12;k++){const a=k*Math.PI/6;pts.push([Math.cos(a)*r,Math.sin(a)*r],[Math.cos(a)*r/2,Math.sin(a)*r/2],[Math.cos(a)*r/4,Math.sin(a)*r/4])}
 return pts.some(([dx,dy])=>{const q=[p[0]+dx,p[1]+dy];return onLand(q)&&tqOk(tq,q)})}
function onLand(pt){try{const l=$('#landp');const q=$('#map').createSVGPoint();q.x=pt[0];q.y=pt[1];return l.isPointInFill(q)}catch(e){return true}}
const ZB='<div class="zb"><button data-z="in" aria-label="acercar">+</button><button data-z="out" aria-label="alejar">−</button><button data-z="fit" aria-label="ver todo">⤢</button></div>';
const swatch=l=>l[3]==='route'?`<i style="background:none;border:0;border-top:3px solid ${l[2]};border-radius:0;height:0;width:18px;vertical-align:4px"></i>`:`<i style="background:${l[2].startsWith('url')?'repeating-linear-gradient('+(l[2]==='url(#hv)'?'90deg':'135deg')+',#333 0 1px,#fff 1px 5px)':l[2]};border:1px solid #999"></i>`;
function map(){
 const m=M();
 $('#main').innerHTML=`<div class="card">${D.maps.length>1?`<div class="chips">${D.maps.map((x,i)=>`<button class="chip" data-mi="${i}" aria-pressed="${i===MI}">${x.tab}</button>`).join('')}</div>`:''}<h2>🗺 ${m.title}</h2><p class="muted">${m.sub} Activa o quita capas en la leyenda. Después practica con «Ciudades» y «Territorios».</p>
 <div class="mapwrap"><svg id="map" viewBox="${VB.join(' ')}"></svg>${ZB}</div>
 <div class="leg" id="leg">${m.layers.map(l=>`<label style="cursor:pointer"><input type="checkbox" data-l="${l[0]}" ${mapOn(l[0])?'checked':''}> ${swatch(l)}${l[1]}</label>`).join('')}${m.legnote?`<span style="color:#777">${m.legnote}</span>`:''}</div>
 <div id="mapinfo" style="margin-top:8px"></div>
 <div class="row"><button class="btn" id="mqc">📍 Ciudades</button><button class="btn" id="mqt">🟧 Territorios</button><button class="btn ghost" id="mv">Ver el mapa</button><span class="score" id="msc"></span></div>
 <div class="ru">${m.ru}</div>${m.how?`<details class="sec how"><summary>ℹ️ ¿Cómo se ha hecho este mapa?</summary><div class="body">${m.how}${m.how_ru?`<div class="ru">${m.how_ru}</div>`:''}</div></details>`:''}</div>`+nextBtn('pyr','Siguiente: pirámide');
 const ch=$('#main').querySelector('[data-mi]');if(ch)ch.parentNode.onclick=e=>{const i=e.target.dataset.mi;if(i!=null){setMap(+i);map()}};
 $('#leg').onchange=e=>{const l=e.target.dataset.l;if(l){(mapOnAll[m.id]=mapOnAll[m.id]||{})[l]=e.target.checked?1:0;LS.set('maplayers',mapOnAll);const v=MV;drawMap(mapMode!=='city');MV=v;applyView()}};
 $('#mv').onclick=()=>{mapMode='ver';mapQ=null;drawMap(true);infoVer()};
 $('#mqc').onclick=()=>{mapMode='city';mapStats={ok:0,n:0};askCity()};
 $('#mqt').onclick=()=>{mapMode='terr';mapStats={ok:0,n:0};askTerr()};
 mapMode='ver';MV=null;drawMap(true);infoVer();
}
function infoVer(){$('#mapinfo').innerHTML=`<p class="muted" style="margin:0">${M().info}</p>`}
function arrowHead(pl,col){const n=pl.length;const a=prj(...pl[n-2]),b=prj(...pl[n-1]);const ang=Math.atan2(b[1]-a[1],b[0]-a[0]);const s=7*VB[2]/840*zk();
 const p1=[b[0]-s*Math.cos(ang-0.45),b[1]-s*Math.sin(ang-0.45)],p2=[b[0]-s*Math.cos(ang+0.45),b[1]-s*Math.sin(ang+0.45)];
 return `<polygon points="${b.join(',')} ${p1.join(',')} ${p2.join(',')}" fill="${col}"/>`}
function drawMap(names,quiz){
 const m=M(),svg=$('#map');let h=`<defs><clipPath id="lc"><path d="${G.land}"/></clipPath>
 <pattern id="hd" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45) scale(${Math.max(.35,VB[2]/840)})"><line x1="0" y1="0" x2="0" y2="6" stroke="#333" stroke-width="1.1"/></pattern>
 <pattern id="hv" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="scale(${Math.max(.35,VB[2]/840)})"><line x1="0" y1="0" x2="0" y2="5" stroke="#222" stroke-width="1"/></pattern></defs>
 <path id="landp" class="land" d="${G.land}"/><g clip-path="url(#lc)">`;
 for(const [id,,fill,kind] of m.layers){if(kind==='route'||!mapOn(id))continue;for(const pl of m.regions[id]||[])h+=`<path d="${poly(pl)}" fill="${fill}" ${fill.startsWith('url')?'':'fill-opacity="'+(kind==='solid'?1:.85)+'"'} stroke="${fill.startsWith('url')?'none':'#9a8a6a'}" stroke-width=".6" vector-effect="non-scaling-stroke"/>`}
 h+='</g>';
 h+=`<path d="${G.rivers}" fill="none" stroke="#4f8fb8" stroke-width="1" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>`;
 for(const [t,lo,la,rot] of m.rivl||[]){const [x,y]=prj(lo,la);h+=`<text data-fs="9" x="${x}" y="${y}" transform="rotate(${rot||0} ${x} ${y})" text-anchor="middle" style="font-style:italic;fill:#2f6f9a;paint-order:stroke;stroke:#fff;stroke-width:2.5px">${t}</text>`}
 for(const [id,name,col,kind] of m.layers){if(kind!=='route'||!mapOn(id))continue;for(const r of m.regions[id]||[]){const pl=r.pts||r;h+=`<path d="${line(pl)}" fill="none" stroke="${col}" stroke-width="2.4" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round" ${r.dash?'stroke-dasharray="6 4"':''}/>`+(r.noarrow?'':arrowHead(pl,col));
   if(r.label){const [x,y]=prj(...(r.lab||pl[Math.floor(pl.length/2)]));h+=`<text data-fs="10" x="${x}" y="${y-4}" text-anchor="middle" style="font-weight:800;fill:${col};paint-order:stroke;stroke:#fff;stroke-width:3px">${r.label}</text>`}}}
 if(!quiz)for(const [t,lo,la] of m.klabels||[]){const [x,y]=prj(lo,la);h+=`<text data-fs="9.5" x="${x}" y="${y}" text-anchor="middle" style="font-weight:800;fill:#3b3b3b;paint-order:stroke;stroke:rgba(255,255,255,.85);stroke-width:2.5px">${t}</text>`}
 for(const [t,lo,la] of m.peoples||[]){const [x,y]=prj(lo,la);h+=`<text data-fs="10" x="${x}" y="${y}" text-anchor="middle" style="font-weight:700;letter-spacing:.06em;fill:#555;paint-order:stroke;stroke:#fff;stroke-width:2.5px">${t}</text>`}
 for(const [t,lo,la] of m.isles||[]){const [x,y]=prj(lo,la);h+=`<text data-fs="9.5" x="${x}" y="${y}" text-anchor="middle" style="font-style:italic;fill:#335;paint-order:stroke;stroke:#cfe1e8;stroke-width:2.5px">${t}</text>`}
 for(const [n,c] of Object.entries(m.cities)){const [x,y]=prj(c[0],c[1]);h+=`<g class="city"><circle data-r="3.6" cx="${x}" cy="${y}" r="3.6"/>${names?`<text data-fs="11" data-dx="5" data-dy="-4" data-x="${x}" data-y="${y}" x="${x+5}" y="${y-4}">${n}</text>`:''}</g>`}
 h+='<g id="mfx"></g>';svg.innerHTML=h;svg.onclick=null;initZoom();
}
let MV=null,MVdrag={moved:0};const zk=()=>MV?MV.w/VB[2]:1;
// on phones the map box is taller than the map's own shape: show the centre and pan sideways
function mapAsp(){const svg=$('#map');const w=svg?svg.parentNode.clientWidth:900;return w<640?Math.max(VB[3]/VB[2],0.62):VB[3]/VB[2]}
function fitView(){const a=mapAsp();let h=VB[3],w=h/a;if(w>VB[2]){w=VB[2];h=w*a}
 const cx=M().cx!=null?prj(M().cx,0)[0]:VB[0]+VB[2]/2;return{x:Math.max(VB[0],Math.min(VB[0]+VB[2]-w,cx-w/2)),y:VB[1],w,h}}
function allView(){const a=mapAsp(),w=VB[2],h=w*a;return{x:VB[0],y:VB[1]+(VB[3]-h)/2,w,h}}
function applyView(){const svg=$('#map');if(!svg||!MV)return;svg.style.aspectRatio=`${MV.w} / ${MV.h}`;svg.setAttribute('viewBox',`${MV.x} ${MV.y} ${MV.w} ${MV.h}`);const k=MV.w/VB[2]*(VB[2]/840);
 svg.querySelectorAll('[data-fs]').forEach(t=>{t.style.fontSize=(+t.dataset.fs*k)+'px';t.style.strokeWidth=(3*k)+'px';if(t.dataset.dx){t.setAttribute('x',+t.dataset.x+5*k);t.setAttribute('y',+t.dataset.y-4*k)}});
 svg.querySelectorAll('[data-r]').forEach(c=>c.setAttribute('r',+c.dataset.r*k));svg.querySelectorAll('.city circle').forEach(c=>c.style.strokeWidth=1.2*k);svg.style.touchAction=MV.w<fitView().w-0.5?'none':'pan-y'}
function zoomAt(f,cx,cy){const nw=Math.max(VB[2]/8,Math.min(VB[2],MV.w*f));const k=nw/MV.w;MV.x=cx-(cx-MV.x)*k;MV.y=cy-(cy-MV.y)*k;MV.w=nw;MV.h*=k;clampView();applyView()}
function clampView(){const cl=(v,a,L,l)=>l>=L?a+(L-l)/2:Math.max(a,Math.min(a+L-l,v));MV.x=cl(MV.x,VB[0],VB[2],MV.w);MV.y=cl(MV.y,VB[1],VB[3],MV.h)}
function initZoom(){const svg=$('#map');if(!MV)MV=fitView();applyView();
 const wrap=svg.parentNode;const zb=wrap.querySelector('.zb');if(zb)zb.onclick=e=>{const z=e.target.dataset.z;if(!z)return;e.stopPropagation();if(z==='fit'){const f=fitView();MV=(Math.abs(MV.w-f.w)<1&&Math.abs(MV.x-f.x)<1&&f.w<VB[2]-1)?allView():f;applyView()}else zoomAt(z==='in'?1/1.6:1.6,MV.x+MV.w/2,MV.y+MV.h/2)};
 const ptrs=new Map();let last=null,pinch=null;
 svg.onpointerdown=e=>{ptrs.set(e.pointerId,[e.clientX,e.clientY]);MVdrag.moved=0;last=[e.clientX,e.clientY];if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch=Math.hypot(a[0]-b[0],a[1]-b[1]);MVdrag.moved=99}};
 svg.onpointermove=e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,[e.clientX,e.clientY]);const r=svg.getBoundingClientRect(),upp=MV.w/r.width;
  if(ptrs.size===2&&pinch){const [a,b]=[...ptrs.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);const cx=MV.x+(((a[0]+b[0])/2)-r.left)*upp,cy=MV.y+(((a[1]+b[1])/2)-r.top)*upp;zoomAt(pinch/d,cx,cy);pinch=d;return}
  if(MV.w>=VB[2]-0.5&&MV.h>=VB[3]-0.5)return;const dx=e.clientX-last[0],dy=e.clientY-last[1];MVdrag.moved+=Math.abs(dx)+Math.abs(dy);if(MVdrag.moved>6){MV.x-=dx*upp;MV.y-=dy*upp;clampView();applyView()}last=[e.clientX,e.clientY]};
 const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null};svg.onpointerup=up;svg.onpointercancel=up;
 svg.onwheel=e=>{e.preventDefault();const r=svg.getBoundingClientRect(),upp=MV.w/r.width;zoomAt(e.deltaY>0?1.2:1/1.2,MV.x+(e.clientX-r.left)*upp,MV.y+(e.clientY-r.top)*upp)};
}
window.addEventListener('resize',()=>{if($('#map')&&MV){const f=fitView();if(Math.abs(MV.w/MV.h-f.w/f.h)>0.01){MV=f;applyView()}}});
function svgPt(e){const svg=$('#map');const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const p=pt.matrixTransform(svg.getScreenCTM().inverse());return[p.x,p.y]}
function nearestCity(p){let best=null,bd=1e9;for(const [n,c] of Object.entries(M().cities)){const [x,y]=prj(c[0],c[1]);const d=Math.hypot(p[0]-x,p[1]-y);if(d<bd){bd=d;best=n}}return[best,bd]}
function cityOk(p,n){const [nn,d]=nearestCity(p);return nn===n&&d<30*VB[2]/840}
const ring=(x,y,ok,n)=>{const k=zk()*VB[2]/840;return `<circle cx="${x}" cy="${y}" r="${13*k}" fill="none" stroke="${ok?'#2f8f5b':'#d1432f'}" stroke-width="${3*k}"/><text x="${x+8*k}" y="${y-8*k}" style="font-size:${12*k}px;font-weight:800;paint-order:stroke;stroke:#fff;stroke-width:${3*k}px">${n}</text>`};
const dot=(p,ok,r=6)=>{const k=zk()*VB[2]/840;return `<circle cx="${p[0]}" cy="${p[1]}" r="${r*k}" fill="${ok?'#2f8f5b':'#d1432f'}" stroke="#fff" stroke-width="${2*k}"/>`};
function askCity(){
 const names=Object.keys(M().cities);let n;do{n=names[Math.floor(Math.random()*names.length)]}while(mapQ&&n===mapQ.n&&names.length>1);
 mapQ={n,done:false};MV=null;drawMap(false);$('#mapinfo').innerHTML=`<span class="q">Toca: ${n}</span>`;$('#msc').textContent=mapStats.n?`${mapStats.ok} / ${mapStats.n}`:'';
 $('#map').onclick=e=>{if(MVdrag.moved>6||mapQ.done)return;mapQ.done=true;const p=svgPt(e);const c=M().cities[n];const [x,y]=prj(c[0],c[1]);const ok=cityOk(p,n);mapStats.n++;if(ok)mapStats.ok++;
  $('#mfx').innerHTML=ring(x,y,ok,n)+(ok?'':dot(p,false,4));
  $('#mapinfo').innerHTML=`<span class="fb ${ok?'ok':'bad'}">${ok?'¡Bien!':'Aquí no.'}</span> ${n}: ${c[2]}. <button class="btn" id="mn" style="margin-left:6px;padding:6px 12px">Siguiente</button>`;
  $('#msc').textContent=`${mapStats.ok} / ${mapStats.n}`;if(mapStats.n>=8&&mapStats.ok/mapStats.n>=0.75){P.map=true;save()}$('#mn').onclick=askCity}
}
function askTerr(){
 const T=M().terrq;let q;do{q=T[Math.floor(Math.random()*T.length)]}while(mapQ&&mapQ.t===q&&T.length>1);
 mapQ={t:q,done:false};MV=null;drawMap(true,true);$('#mapinfo').innerHTML=`<span class="q">${q.q}</span>`;$('#msc').textContent=mapStats.n?`${mapStats.ok} / ${mapStats.n}`:'';
 $('#map').onclick=e=>{if(MVdrag.moved>6||mapQ.done)return;mapQ.done=true;const p=svgPt(e);const ok=terrHit(p,q);mapStats.n++;if(ok)mapStats.ok++;
  $('#mfx').innerHTML=dot(p,ok);
  $('#mapinfo').innerHTML=`<span class="fb ${ok?'ok':'bad'}">${ok?'¡Bien!':'No.'}</span> Respuesta: ${q.a}. <button class="btn" id="mn" style="margin-left:6px;padding:6px 12px">Siguiente</button>`;
  $('#msc').textContent=`${mapStats.ok} / ${mapStats.n}`;if(mapStats.n>=8&&mapStats.ok/mapStats.n>=0.75){P.map=true;save()}$('#mn').onclick=askTerr}
}

/* -------- 4. pyramid -------- */
let pyrSel=null,pyrPlace={};
function pyr(){
 const L=D.pyramid.levels;const items=D.pyramid.items;
 const pool=items.filter(it=>pyrPlace[it[0]]==null);
 $('#main').innerHTML=`<div class="card"><h2>🔺 ${D.pyramid.title}</h2><p class="muted">Toca un grupo y después el escalón donde va. ${D.pyramid.note}</p><div class="ru">Нажми на группу, потом на уровень пирамиды.</div>
 <div class="pool">${shuffle(pool).map(it=>`<button class="tag ${pyrSel===it[0]?'sel':''}" data-t="${esc(it[0])}">${it[0]}</button>`).join('')||'<span class="muted">Todos colocados</span>'}</div>
 <div class="pyr">${D.pyramid.apex?`<div style="justify-self:center;background:var(--biz);color:#fff;border-radius:10px;padding:4px 12px;font-weight:800;font-size:.85rem">👑 ${D.pyramid.apex}</div>`:''}${L.map((l,i)=>`<div class="lvl" data-l="${i}" style="width:${Math.min(100,50+i*(50/Math.max(1,L.length-1)))}%;justify-self:center"><h4>${l}</h4><div class="in">${items.filter(it=>pyrPlace[it[0]]===i).map(it=>`<span class="tag" data-back="${esc(it[0])}">${it[0]}</span>`).join('')}</div></div>`).join('')}</div>
 <div class="row"><button class="btn" id="pc" ${pool.length?'disabled':''}>Comprobar</button><button class="btn ghost" id="pr">Empezar de nuevo</button><button class="btn ghost" id="ps">Ver solución</button></div><p class="fb" id="pf"></p></div>`+nextBtn('cards','Siguiente: tarjetas');
 $('#main').querySelectorAll('.pool .tag').forEach(b=>b.onclick=()=>{pyrSel=b.dataset.t;pyr()});
 $('#main').querySelectorAll('.lvl').forEach(d=>d.onclick=e=>{const back=e.target.closest('[data-back]');if(back){delete pyrPlace[back.dataset.back];pyr();return}if(pyrSel){pyrPlace[pyrSel]=+d.dataset.l;pyrSel=null;pyr()}});
 $('#pr').onclick=()=>{pyrPlace={};pyrSel=null;pyr()};
 $('#ps').onclick=()=>{items.forEach(it=>pyrPlace[it[0]]=it[1]);pyr();$('#pf').className='fb';$('#pf').textContent='Esta es la solución. Pulsa «Empezar de nuevo» e inténtalo tú.'};
 $('#pc').onclick=()=>{let bad=0;$('#main').querySelectorAll('[data-back]').forEach(t=>{const it=items.find(x=>x[0]===t.dataset.back);const ok=it[1]===pyrPlace[it[0]];t.classList.add(ok?'ok':'bad');if(!ok)bad++});
  const f=$('#pf');if(!bad){f.className='fb ok';f.textContent='¡Perfecto! Pirámide correcta ✓';P.pyr=true;save()}else{f.className='fb bad';f.textContent=`${bad} grupo(s) mal colocados (en rojo). Tócalos para devolverlos.`}};
}

/* -------- 5. flashcards -------- */
let C={q:[],cur:null,flip:false,rev:false};
function cards(){
 if(!C.q.length){C.q=shuffle(D.cards.map(c=>c[0])).sort((a,b)=>(P.cards[a]||0)-(P.cards[b]||0))}
 if(!C.cur)C.cur=C.q.shift();
 const c=D.cards.find(x=>x[0]===C.cur);const known=D.cards.filter(x=>(P.cards[x[0]]||0)>=2).length;
 const front=C.rev?`<div class="d">${c[1]}</div><span class="muted">¿Qué es o quién es?</span>`:`<div class="t">${c[0]}</div><span class="muted">¿Qué sabes de esto? (toca para girar)</span>`;
 const back=`<div class="t">${c[0]}</div><div class="d">${c[1]}</div><div class="ru">${c[2]}</div>`;
 $('#main').innerHTML=`<div class="card"><h2>🃏 Tarjetas</h2><p class="muted">Sabes bien: <b>${known} / ${D.cards.length}</b> (cada tarjeta, 2 aciertos seguidos). Las que fallas vuelven antes.</p>
 <div class="chips"><button class="chip" id="rv" aria-pressed="${C.rev}">Definición → nombre</button></div>
 <button class="fc" id="fc">${C.flip?back:front}</button>
 ${C.flip?`<div class="row"><button class="btn ok" id="kn">✓ Lo sabía</button><button class="btn ghost" id="nk">✗ No lo sabía</button></div>`:''}</div>`+nextBtn('quiz','Siguiente: test');
 $('#fc').onclick=()=>{if(!C.flip){C.flip=true;cards()}};
 $('#rv').onclick=()=>{C.rev=!C.rev;C.flip=false;cards()};
 if(C.flip){$('#kn').onclick=()=>{P.cards[c[0]]=(P.cards[c[0]]||0)+1;nextCard()};$('#nk').onclick=()=>{P.cards[c[0]]=0;C.q.splice(Math.min(3,C.q.length),0,c[0]);nextCard()}}
}
function nextCard(){save();C.cur=null;C.flip=false;cards()}

/* -------- 6. quiz -------- */
let Qt='all',Qs=null;
function quiz(){
 const pool=D.quiz.map((q,i)=>({...q,i})).filter(q=>Qt==='all'||q.topic===Qt);
 if(!Qs||Qs.topic!==Qt){Qs={topic:Qt,list:shuffle(pool).sort((a,b)=>(P.quiz[a.i]===true)-(P.quiz[b.i]===true)),k:0,ok:0,n:0}}
 const right=Object.values(P.quiz).filter(v=>v===true).length;
 const q=Qs.list[Qs.k%Qs.list.length];const opts=shuffle([q.a,...q.w]);
 $('#main').innerHTML=`<div class="card"><h2>✅ Test por temas</h2><p class="muted">Acertadas alguna vez: <b>${right} / ${D.quiz.length}</b>. Primero salen las que aún no has acertado.</p>
 <div class="chips">${[['all','Todo'],...Object.entries(TOPICS)].map(t=>`<button class="chip" data-t="${t[0]}" aria-pressed="${Qt===t[0]}">${t[1]}</button>`).join('')}</div>
 <p class="score">Pregunta ${Qs.n+1} · ${Qs.ok} / ${Qs.n} en esta ronda · tema: ${TOPICS[q.topic]}</p>
 <p class="q">${q.q}</p><div class="opts">${opts.map(o=>`<button data-o="${esc(o)}">${o}</button>`).join('')}</div><div id="qf"></div></div>`+nextBtn('open','Siguiente: preguntas largas');
 $('#main').querySelector('.chips').onclick=e=>{const t=e.target.dataset.t;if(t){Qt=t;Qs=null;quiz()}};
 $('#main').querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{
  const ok=b.dataset.o===q.a;$('#main').querySelectorAll('.opts button').forEach(x=>{x.disabled=true;if(x.dataset.o===q.a)x.classList.add('ok')});if(!ok)b.classList.add('bad');
  Qs.n++;if(ok){Qs.ok++;P.quiz[q.i]=true}else if(P.quiz[q.i]!==true)P.quiz[q.i]=false;save();
  $('#qf').innerHTML=`<p class="fb ${ok?'ok':'bad'}">${ok?'¡Correcto!':'Incorrecto.'}</p><p class="expl">${q.e}</p><div class="row"><button class="btn" id="qn">Siguiente</button></div>`;
  $('#qn').onclick=()=>{Qs.k++;quiz()};$('#qn').focus()});
}

/* -------- 7. open questions -------- */
let Oi=0;
function largas(){
 const o=D.open[Oi];const st=P.open[Oi];
 $('#main').innerHTML=`<div class="card"><h2>✍️ Preguntas largas (de desarrollo)</h2><p class="muted">Así suelen ser las preguntas del examen. Escribe tu respuesta (o dila en voz alta), después abre el ejemplo de respuesta y marca las ideas que incluiste. En el cuaderno y en el examen, escribe siempre con tus propias palabras.</p><div class="ru">Сначала напиши ответ сам(а), потом открой пример ответа и отметь, какие ключевые идеи у тебя были. В тетради и на экзамене пиши своими словами.</div>
 <div class="chips">${D.open.map((x,i)=>`<button class="chip" data-i="${i}" aria-pressed="${i===Oi}">${i+1}${P.open[i]!=null?' ✓':''}</button>`).join('')}</div>
 <p class="q">${Oi+1}. ${o.q}</p><textarea id="ot" placeholder="Escribe aquí tu respuesta…">${esc(LS.get('ans'+Oi,''))}</textarea>
 <div class="row"><button class="btn" id="os">👀 Ver un ejemplo de respuesta</button></div><div id="om"></div></div>`+nextBtn('exam','Siguiente: examen final');
 $('#main').querySelector('.chips').onclick=e=>{const i=e.target.dataset.i;if(i!=null){Oi=+i;largas()}};
 $('#ot').oninput=e=>LS.set('ans'+Oi,e.target.value);
 const show=()=>{$('#om').innerHTML=`<div class="model"><b>Un ejemplo de respuesta</b> <span class="muted">(no la copies: úsala para comprobar tus ideas)</span><p style="margin:6px 0 0">${o.a}</p></div><div class="kw" style="margin-top:10px"><b>¿Qué ideas clave has puesto?</b>${o.k.map((k,j)=>`<label><input type="checkbox" data-j="${j}"> ${k}</label>`).join('')}</div><div class="row"><button class="btn" id="og">Guardar y siguiente</button></div><p class="fb" id="okf"></p>`;
  $('#og').onclick=()=>{const n=$('#om').querySelectorAll('input:checked').length;P.open[Oi]=n;save();toast(`${n} / ${o.k.length} ideas clave`);Oi=(Oi+1)%D.open.length;largas()}};
 $('#os').onclick=()=>{if($('#om').innerHTML){$('#om').innerHTML='';$('#os').textContent='👀 Ver un ejemplo de respuesta'}else{show();$('#os').textContent='🙈 Ocultar el ejemplo'}};
}

/* -------- 8. exam -------- */
let E=null;
function exam(){
 if(!E){
  $('#main').innerHTML=`<div class="card"><h2>🎯 Examen final</h2><p>20 preguntas mezcladas, como en una prueba real: test, verdadero/falso, fechas, mapa y pirámide. Sin ayudas. Al final verás tu nota sobre 10 y los errores para repasar.</p><div class="ru">20 смешанных вопросов без подсказок. В конце — оценка из 10 и разбор ошибок.</div>
  <div class="grid2" style="margin-top:10px"><div class="stat"><span class="muted">Mejor nota</span><b>${P.best!=null?P.best.toLocaleString('es')+' / 10':'—'}</b></div><div class="stat"><span class="muted">Recomendado</span><b style="font-size:1rem">Haz antes los pasos 1–7</b></div></div>
  <div class="row"><button class="btn" id="es">Empezar el examen</button></div></div>`;
  $('#es').onclick=()=>{E=buildExam();examQ()};return}
 examQ();
}
function buildExam(){
 const it=[];
 shuffle(D.quiz).slice(0,11).forEach(q=>it.push({t:'mc',q:q.q,a:q.a,o:shuffle([q.a,...q.w]),e:q.e}));
 shuffle(D.tf).slice(0,4).forEach(q=>it.push({t:'mc',q:'Verdadero o falso: '+q[0],a:q[1]?'Verdadero':'Falso',o:['Verdadero','Falso'],e:q[2]}));
 shuffle(D.timeline.filter(t=>D.tlcore.includes(t[0]))).slice(0,2).forEach(t=>it.push({t:'yr',q:t[1],a:t[0]}));
 {const mi=Math.floor(Math.random()*D.maps.length);const cn=shuffle(Object.keys(D.maps[mi].cities))[0];it.push({t:'map',q:'Localiza en el mapa: '+cn,n:cn,mi})}{const mi=Math.floor(Math.random()*D.maps.length);const T=D.maps[mi].terrq;const tq=T[Math.floor(Math.random()*T.length)];it.push({t:'terr',q:tq.q,tq,mi})}
 const pi=D.pyramid.items[Math.floor(Math.random()*D.pyramid.items.length)];it.push({t:'mc',q:`¿En qué escalón de la pirámide estaban «${pi[0]}»?`,a:D.pyramid.levels[pi[1]],o:D.pyramid.levels.slice(),e:D.pyramid.src});
 return{items:shuffle(it),k:0,ok:0,wrong:[]};
}
function examQ(){
 if(E.k>=E.items.length)return examEnd();
 const q=E.items[E.k];let body='';
 if(q.t==='mc')body=`<div class="opts">${q.o.map(o=>`<button data-o="${esc(o)}">${o}</button>`).join('')}</div>`;
 if(q.t==='yr')body=`<p class="muted">¿En qué año?</p><div class="row"><input class="yr" id="ey" inputmode="numeric" maxlength="4"><button class="btn" id="eyc">Responder</button></div>`;
 if(q.t==='map'||q.t==='terr'){setMap(q.mi);body=`<div class="mapwrap"><svg id="map" viewBox="${VB.join(' ')}"></svg>${ZB}</div>`}
 $('#main').innerHTML=`<div class="card"><p class="score">Pregunta ${E.k+1} / ${E.items.length} · aciertos ${E.ok}</p><div class="prog"><i style="width:${E.k/E.items.length*100}%"></i></div><p class="q">${q.q}</p>${body}<div id="ef"></div></div>`;
 const fin=(ok,msg)=>{if(ok)E.ok++;else E.wrong.push({q:q.q,a:msg});$('#ef').innerHTML=`<p class="fb ${ok?'ok':'bad'}">${ok?'¡Correcto!':'Incorrecto. Respuesta: '+msg}</p>${q.e&&!ok?`<p class="expl">${q.e}</p>`:''}<div class="row"><button class="btn" id="en">${E.k+1<E.items.length?'Siguiente':'Ver nota'}</button></div>`;$('#en').onclick=()=>{E.k++;examQ()};$('#en').focus()};
 if(q.t==='mc')$('#main').querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{const ok=b.dataset.o===q.a;$('#main').querySelectorAll('.opts button').forEach(x=>{x.disabled=true;if(x.dataset.o===q.a)x.classList.add('ok')});if(!ok)b.classList.add('bad');fin(ok,q.a)});
 if(q.t==='yr'){const go_=()=>{const v=+$('#ey').value;if(!v)return;$('#eyc').disabled=true;$('#ey').disabled=true;fin(v===q.a,String(q.a))};$('#eyc').onclick=go_;$('#ey').onkeydown=e=>{if(e.key==='Enter')go_()};$('#ey').focus()}
 if(q.t==='map'){mapQ=null;drawMap(false);let done=false;$('#map').onclick=e=>{if(MVdrag.moved>6||done)return;done=true;const p=svgPt(e);const c=M().cities[q.n];const [x,y]=prj(c[0],c[1]);const ok=cityOk(p,q.n);
  $('#mfx').innerHTML=ring(x,y,ok,q.n);fin(ok,q.n+' (marcada en el mapa)')}}
 if(q.t==='terr'){mapQ=null;drawMap(true,true);let done=false;$('#map').onclick=e=>{if(MVdrag.moved>6||done)return;done=true;const p=svgPt(e);const ok=terrHit(p,q.tq);
  $('#mfx').innerHTML=dot(p,ok);fin(ok,q.tq.a)}}
}
function examEnd(){
 const n=E.items.length,g=Math.round(E.ok/n*100)/10;if(P.best==null||g>P.best)P.best=g;save();
 const msg=g>=9?'¡Sobresaliente! 🎉':g>=7?'¡Notable! Repasa los errores y repite.':g>=5?'Aprobado. Repasa las tarjetas y el test de los temas con errores.':'Todavía no. Vuelve a «Aprender» y al test por temas.';
 $('#main').innerHTML=`<div class="card"><h2>Resultado</h2><div class="big">${g.toLocaleString('es')} / 10</div><p>${E.ok} de ${n} correctas. ${msg}</p>
 ${E.wrong.length?`<h3>Para repasar</h3><ul class="res">${E.wrong.map(w=>`<li>${w.q}<br><b style="color:var(--ok)">→ ${w.a}</b></li>`).join('')}</ul>`:''}
 <div class="row"><button class="btn" id="er">Otro examen</button></div></div>`;
 $('#er').onclick=()=>{E=buildExam();examQ()};
}

renderSteps();go(cur);
</script>
</body>
