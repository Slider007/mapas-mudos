<!doctype html>
<html lang="es" data-theme="light" style="color-scheme:light">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bizancio — preparar la prueba</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9B%AA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f2f45;--ink2:#5b6b80;--bg:#f7f5fb;--panel:#fff;--soft:#efeaf7;--line:#d9cfea;--biz:#7e57c2;--biz2:#5e35b1;--gold:#c9a227;--ok:#2f8f5b;--bad:#d1432f;--hi:#f2a516;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
.app{max-width:980px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 14px 40px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:4px 0 8px}
.home{color:var(--ink2);text-decoration:none;font-size:.85rem;font-weight:600;border:1.5px solid var(--ink2);border-radius:99px;padding:3px 10px}
.home:hover{color:var(--ink);border-color:var(--ink)}
h1{flex:0 0 100%;order:3;margin:2px 0 0;font-size:1.5rem;font-weight:800;letter-spacing:-.01em;line-height:1.15}
h1 small{display:block;font-size:.85rem;font-weight:400;color:var(--ink2)}
.tools{margin-left:auto;display:flex;gap:6px;align-items:center}
.tog{display:flex;gap:5px;align-items:center;font-size:.82rem;color:var(--ink2);cursor:pointer;border:1.5px solid var(--line);border-radius:99px;padding:3px 10px;background:var(--panel)}
.pdf{font-size:.82rem;font-weight:700;text-decoration:none;color:#fff;background:var(--biz);border-radius:99px;padding:5px 12px}
.steps{display:flex;gap:6px;overflow-x:auto;padding:6px 0 10px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.steps button{flex:none;border:1.5px solid var(--line);background:var(--panel);border-radius:14px;padding:7px 11px;font-weight:700;font-size:.86rem;cursor:pointer;white-space:nowrap}
.steps button[aria-pressed=true]{background:var(--biz);border-color:var(--biz);color:#fff}
.steps button .ck{color:var(--ok);margin-left:4px}
.steps button[aria-pressed=true] .ck{color:#d6f5e2}
.prog{height:6px;border-radius:9px;background:var(--soft);overflow:hidden;margin:0 0 12px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--biz),var(--gold));transition:width .4s}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:18px;padding:16px 18px;margin:0 0 12px}
h2{margin:0 0 6px;font-size:1.2rem}
h3{margin:0 0 4px;font-size:1.05rem}
.muted{color:var(--ink2);font-size:.9rem}
.ru{color:#6a4fa3;font-size:.9rem;background:#f4effc;border-left:3px solid #b9a3e3;padding:6px 10px;border-radius:0 10px 10px 0;margin:8px 0 0}
body.noru .ru{display:none}
.pts{margin:6px 0 0;padding:0;list-style:none}
.pts li{margin:6px 0}
.key{margin-top:10px;font-size:.88rem;background:#fff8e1;border:1px solid #f0dd9c;border-radius:12px;padding:7px 10px}
.key b{color:#8a6d00}
details.sec{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;margin:0 0 10px;overflow:hidden}
details.sec summary{list-style:none;cursor:pointer;padding:13px 16px;font-weight:800;display:flex;gap:10px;align-items:center}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary .st{margin-left:auto;font-size:.8rem;font-weight:700;color:var(--ink2)}
details.sec summary .st.ok{color:var(--ok)}
details.sec .body{padding:0 16px 14px}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--biz);color:#fff}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.ok{background:var(--ok)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.chip{border:1.5px solid var(--line);background:var(--panel);border-radius:99px;padding:4px 11px;font-size:.84rem;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.opts{display:grid;gap:8px;margin-top:10px}
.opts button{text-align:left;border:1.5px solid var(--line);background:var(--panel);border-radius:12px;padding:11px 12px;cursor:pointer;font-weight:600}
.opts button:hover:not(:disabled){border-color:var(--biz)}
.opts button.ok{border-color:var(--ok);background:#e6f4ec}
.opts button.bad{border-color:var(--bad);background:#fbe9e6}
.fb{margin-top:10px;font-weight:700}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.expl{margin-top:6px;font-size:.92rem;color:var(--ink2)}
.score{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:.86rem}
.q{font-size:1.15rem;font-weight:800;margin:4px 0}
/* timeline */
.tl{position:relative;margin:8px 0 0;padding-left:22px}
.tl:before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:3px;background:linear-gradient(var(--biz),var(--gold));border-radius:3px}
.tli{position:relative;margin:0 0 10px}
.tli:before{content:"";position:absolute;left:-19px;top:6px;width:11px;height:11px;border-radius:50%;background:#fff;border:3px solid var(--biz)}
.tli.core:before{background:var(--gold);border-color:var(--gold)}
.tli b{display:inline-block;min-width:52px;font-variant-numeric:tabular-nums}
.ord{display:grid;gap:8px;margin-top:10px}
.ord button{text-align:left;border:1.5px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 12px;cursor:pointer;font-weight:600}
.ord button.done{background:#e6f4ec;border-color:var(--ok)}
.ord button.bad{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
input.yr{width:110px;font-size:1.2rem;padding:8px 10px;border-radius:12px;border:1.5px solid var(--line)}
/* map */
.mapwrap{position:relative;border-radius:16px;overflow:hidden;background:#cfe1e8;border:1.5px solid var(--line);touch-action:manipulation}
svg#map{display:block;width:100%;height:auto;cursor:crosshair}
.land{fill:#f3eee0;stroke:#c9bfa6;stroke-width:.6}
.biz{fill:#7e57c2;fill-opacity:.42;stroke:#5e35b1;stroke-width:1}
.oto{fill:#00897b;fill-opacity:.35;stroke:#00695c;stroke-width:1}
.city circle{fill:#7a2e2e;stroke:#fff;stroke-width:1.2}
.city text{font-size:11px;font-weight:700;fill:#2b2b2b;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:.82rem;margin-top:6px}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
/* pyramid */
.pyr{display:grid;gap:6px;margin:10px auto;max-width:560px}
.lvl{border:2px dashed var(--line);border-radius:12px;padding:8px;min-height:52px;text-align:center;cursor:pointer;background:var(--panel)}
.lvl.sel{border-color:var(--biz);background:#f4effc}
.lvl h4{margin:0 0 4px;font-size:.8rem;color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
.lvl .in{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.tag{border:1.5px solid var(--ink2);background:#fff;border-radius:99px;padding:4px 10px;font-size:.84rem;cursor:pointer;font-weight:600}
.tag.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.tag.ok{border-color:var(--ok);background:#e6f4ec}
.tag.bad{border-color:var(--bad);background:#fbe9e6}
.pool{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
/* flashcards */
.fc{width:100%;min-height:190px;border:2px solid var(--line);border-radius:18px;background:linear-gradient(160deg,#fff,#f6f1ff);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;cursor:pointer;gap:6px}
.fc .t{font-size:1.6rem;font-weight:800;color:var(--biz2)}
.fc .d{font-size:1.05rem;font-weight:600}
/* open */
textarea{width:100%;min-height:120px;border:1.5px solid var(--line);border-radius:12px;padding:10px;resize:vertical}
.model{background:#f1f8f4;border:1.5px solid #bfe3cd;border-radius:12px;padding:10px 12px;margin-top:10px}
.kw label{display:flex;gap:8px;align-items:flex-start;margin:5px 0;cursor:pointer}
/* exam */
.big{font-size:2.6rem;font-weight:800;color:var(--biz2);line-height:1}
.res li{margin:6px 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.stat{background:var(--soft);border-radius:14px;padding:10px 12px}
.stat b{font-size:1.4rem;display:block}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:8px 16px;border-radius:12px;font-weight:700;transition:transform .25s;z-index:9}
.toast.on{transform:translateX(-50%) translateY(0)}
footer{margin-top:20px;font-size:.75rem;color:var(--ink2)}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
</style>
</head>
<body>
<div class="app">
<header>
 <a class="home" href="../">← <span data-es="Lecciones" data-ru="Уроки">Lecciones</span></a>
 <h1>⛪ El Imperio bizantino<small>Tema 1 · preparar la prueba: aprender → repasar → examen</small></h1>
 <div class="tools">
  <label class="tog"><input type="checkbox" id="rut" checked> RU</label>
  <a class="pdf" href="pdf/chuleta-bizantinos.pdf" download>📄 Chuleta PDF</a>
 </div>
</header>
<nav class="steps" id="steps"></nav>
<div class="prog"><i id="pbar" style="width:0"></i></div>
<main id="main"></main>
<footer>Fuentes: libro de texto (Tema 1, p. 22–25) y resumen del profesor. Mapa: dibujado según el mapa 18 del libro (p. 23), territorios aproximados; costas: Natural Earth.</footer>
</div>
<div class="toast" id="toast"></div>
<script>
const D={"sections": [{"id": "origen", "t": "1. Origen del Imperio bizantino", "tr": "Происхождение Византийской империи", "pts": ["Desde el siglo III el Imperio romano vivía una <b>profunda crisis<\/b> (económica, política, militar y moral) y sufría la <b>amenaza de los germanos<\/b>.", "En el <b>395<\/b> el emperador <b>Teodosio<\/b> dividió el Imperio en dos para facilitar su defensa:", "• <b>Imperio romano de Occidente<\/b> → su hijo <b>Honorio<\/b>, capital <b>Roma<\/b>. Cayó en el <b>476<\/b>.", "• <b>Imperio romano de Oriente<\/b> → su hijo <b>Arcadio<\/b>, capital <b>Constantinopla<\/b>. Duró <b>más de mil años<\/b> (hasta 1453) y pasó a llamarse <b>Imperio bizantino<\/b> (por Bizancio, el antiguo nombre de Constantinopla).", "Causas de la crisis (resumen): <b>económicas<\/b> (poca producción de alimentos, subida de precios), <b>políticas<\/b> (corrupción, inestabilidad, los militares toman el control), <b>militares<\/b> (el ejército busca poder y no defiende las fronteras → ataques bárbaros) y <b>morales<\/b> (se impone el cristianismo, se relajan las costumbres)."], "ru": "Из-за кризиса и угрозы германцев в 395 г. Феодосий разделил империю: Запад (Гонорий, Рим) пал в 476 г., Восток (Аркадий, Константинополь) просуществовал больше тысячи лет, до 1453 г., и стал называться Византийской империей.", "key": "395 · Teodosio · Honorio (Occidente, Roma) · Arcadio (Oriente, Constantinopla) · más de 1000 años"}, {"id": "gobierno", "t": "2. ¿Cómo se gobernaba?", "tr": "Как управлялась империя", "pts": ["En la cúspide estaba el <b>basileus<\/b> o emperador, que <b>concentraba todos los poderes<\/b>: dirigía el <b>ejército<\/b> y la <b>Administración<\/b> y era el <b>jefe religioso<\/b>. Su poder venía de Dios.", "Le ayudaban tres pilares: una <b>red de funcionarios<\/b> (muy extensa, especializados y con gran formación), un <b>cuerpo diplomático<\/b> (relaciones con otros pueblos y territorios) y un <b>poderoso ejército<\/b> (defendía las fronteras y exploraba territorios).", "En todo el Imperio regían las mismas leyes: el <b>Código de Justiniano<\/b> (recopilación de leyes romanas).", "El territorio se dividía en <b>themas<\/b> (provincias), cada una gobernada por un <b>estratega<\/b> que obedecía al emperador.", "Gracias a esta <b>sólida estructura<\/b> el Imperio pervivió más de mil años."], "ru": "Во главе стоял базилевс (император) со всей властью: армия, управление, глава церкви. Ему помогали чиновники, дипломаты и сильная армия. Единые законы — Кодекс Юстиниана. Провинции — фемы со стратегами.", "key": "basileus = todos los poderes · funcionarios · diplomáticos · ejército · Código de Justiniano · themas y estrategas"}, {"id": "justiniano", "t": "3. El esplendor: Justiniano y Teodora (527–565)", "tr": "Расцвет при Юстиниане и Феодоре", "pts": ["El Imperio alcanzó su <b>esplendor<\/b> con el emperador <b>Justiniano<\/b>, que gobernó junto con su esposa <b>Teodora<\/b> entre <b>527 y 565<\/b>.", "<b>Militar:<\/b> quiso <b>reconstruir la unidad del antiguo Imperio romano<\/b>. Su ejército (general <b>Belisario<\/b>) venció a los <b>vándalos<\/b> en el norte de África, a los <b>ostrogodos<\/b> en Italia y a los <b>visigodos<\/b> en el sur de Hispania.", "<b>Económico:<\/b> prosperidad; se embelleció Constantinopla; creció el <b>comercio por el Mediterráneo<\/b> y se acuñaron <b>monedas de oro (el sólido)<\/b>, principal medio de pago en Europa durante mucho tiempo.", "<b>Cultural:<\/b> la capital, entre <b>Asia y Europa<\/b>, recibía influencias de muchos lugares. Se construyó <b>Santa Sofía<\/b> y se recopiló el <b>Código de Justiniano<\/b>."], "ru": "Расцвет — при Юстиниане и Феодоре (527–565): хотел восстановить Римскую империю, отвоевал Северную Африку (вандалы), Италию (остготы), юг Испании (вестготы). Торговля, золотая монета солид, Святая София, Кодекс.", "key": "527–565 · Teodora · vándalos (África) · ostrogodos (Italia) · visigodos (sur de Hispania) · sólido · Santa Sofía"}, {"id": "territorios", "t": "4. Territorios y lento declive", "tr": "Территории и медленный упадок", "pts": ["Al principio comprendía: <b>Grecia, los Balcanes, Asia Menor (Anatolia), Siria, Palestina y Egipto<\/b>.", "<b>Conquistas de Justiniano:<\/b> norte de África (Cartago), <b>península itálica<\/b> (Rávena, Roma), Sicilia, Cerdeña, Córcega, <b>Islas Baleares<\/b>, el <b>sur y sureste de Hispania<\/b> (Málaga, Cartagena) y <b>Ceuta<\/b>.", "<b>Territorios actuales de España que fueron bizantinos:<\/b> la costa sur y sureste (Málaga, Cartagena), las Islas Baleares y Ceuta.", "Las conquistas duraron poco: crisis económica, política y militar, luchas dinásticas y ataques extranjeros:", "• s. VI: los <b>lombardos<\/b> expulsan a los bizantinos del norte y centro de Italia.", "• s. VII: los <b>visigodos<\/b> los expulsan del sur de la península ibérica.", "• s. VII–VIII: los <b>musulmanes<\/b> conquistan Egipto, la costa de África, Siria y Palestina. También luchó contra persas y eslavos (búlgaros).", "• Después gran parte pasó a los <b>turcos<\/b>. A principios del s. XV solo quedaba Constantinopla.", "• En <b>1453<\/b>, tras un largo asedio, los turcos del sultán <b>Mehmet II<\/b> conquistaron Constantinopla (la llamaron <b>Estambul<\/b>). Fin del Imperio bizantino y de la Edad Media."], "ru": "Сначала: Греция, Балканы, Малая Азия, Сирия, Палестина, Египет. Юстиниан добавил Африку, Италию, острова, юг Испании и Сеуту. Потом потери: лангобарды (Италия, VI в.), вестготы (Испания, VII в.), мусульмане (Египет, Сирия, VII–VIII вв.), турки. 1453 — Мехмед II берёт Константинополь (Стамбул).", "key": "lombardos (s. VI) · visigodos (s. VII) · musulmanes (s. VII–VIII) · turcos · 1453 Mehmet II · Estambul"}, {"id": "sociedad", "t": "5. Sociedad y ciudades", "tr": "Общество и города", "pts": ["Por encima de todos estaba el <b>emperador (basileus)<\/b>. La sociedad formaba una <b>pirámide<\/b> (resumen del profesor):", "• <b>1º (arriba): la nobleza terrateniente<\/b>: propietarios de grandes tierras (<b>latifundios<\/b>) que ocupaban los <b>altos cargos de la Administración y del Ejército<\/b>.", "• <b>2º: campesinos con tierras<\/b>. Cada vez fueron más numerosos, porque a los <b>soldados se les daba un trozo de tierra<\/b> a cambio de proteger una provincia.", "• <b>3º (abajo): los colonos<\/b>: hombres <b>libres<\/b> que trabajaban las tierras de los propietarios <b>a cambio de dinero o de parte de la cosecha<\/b>.", "Con la <b>crisis del siglo XI<\/b> los grandes propietarios se hicieron más ricos: se quedaron con las tierras de los pequeños campesinos, que tenían que abandonarlas al endeudarse por los impuestos.", "<b>En las ciudades<\/b> vivían funcionarios, grandes propietarios, <b>comerciantes<\/b> y <b>artesanos<\/b>. Los artesanos se organizaban en <b>gremios<\/b> (artesanos de un mismo oficio con las mismas normas).", "El Imperio heredó de Roma una organización <b>eminentemente urbana<\/b>: Constantinopla, <b>Alejandría, Tesalónica, Damasco y Éfeso<\/b> conservaron su importancia. En ellas estaban el gobierno, el ejército, los obispados, los <b>talleres<\/b>, los <b>mercados<\/b> y un intenso <b>comercio exterior<\/b>. Sí se parecían a las ciudades romanas (en Occidente, en cambio, las ciudades se despoblaron).", "<i>Ojo: el libro (p. 24) dibuja la pirámide de otra forma (basileus; patriarca, alto clero y nobleza; artesanos, comerciantes, soldados y campesinos libres; siervos y esclavos). Para la prueba usa la del profesor.<\/i>"], "ru": "Над всеми — император (базилевс). Пирамида по конспекту учителя: 1) знать-землевладельцы (латифундии, высшие должности в управлении и армии); 2) крестьяне с землёй (солдатам давали участок за охрану провинции); 3) колоны — свободные, работали на чужой земле за деньги или часть урожая. В кризис XI в. крупные землевладельцы забирали землю мелких крестьян. В городах — чиновники, землевладельцы, торговцы и ремесленники (цехи). Империя оставалась городской.", "key": "basileus encima · 1º nobleza terrateniente (latifundios, altos cargos) · 2º campesinos con tierras (soldados) · 3º colonos · ciudades: gremios · urbana"}, {"id": "constantinopla", "t": "6. Constantinopla, la nueva Roma", "tr": "Константинополь — новый Рим", "pts": ["Fundada por el emperador <b>Constantino<\/b> en el <b>330<\/b> sobre la antigua <b>Bizancio<\/b>.", "Situada en el estrecho del <b>Bósforo<\/b>, controlaba las <b>rutas comerciales entre Europa y Asia<\/b>. Tenía varios puertos y atraía a mercaderes y viajeros.", "Con Justiniano alcanzó <b>medio millón de habitantes<\/b>.", "Protegida por un <b>doble cinturón de murallas<\/b> (murallas de Constantino y de <b>Teodosio II<\/b>). Límites: las murallas por tierra (oeste), el <b>Cuerno de Oro<\/b> (norte) y el <b>mar de Mármara<\/b> (sur).", "Edificios: el <b>palacio imperial<\/b>, la iglesia de <b>Santa Sofía<\/b> (Justiniano), el <b>hipódromo<\/b> (unas <b>100.000<\/b> personas), foros como el de Constantino y la <b>cisterna de Aecio<\/b> para almacenar agua.", "Hoy se llama <b>Estambul<\/b> (Turquía). Su centro histórico es <b>Patrimonio de la Humanidad desde 1985<\/b>, por sus monumentos únicos (Santa Sofía, murallas, hipódromo, Topkapi, Mezquita Azul) y por ser punto de encuentro entre Europa y Asia y entre el arte bizantino y el otomano.", "<b>Santa Sofía:<\/b> iglesia (537) → mezquita (1453) → museo (1934) → mezquita (2020)."], "ru": "Основан Константином в 330 г. на месте Византия, у пролива Босфор; контролировал торговлю Европы и Азии. При Юстиниане — полмиллиона жителей, двойные стены, дворец, Святая София, ипподром на 100 000 человек, цистерна. Сегодня Стамбул; исторический центр в списке ЮНЕСКО с 1985 г.", "key": "330 · Constantino · Bósforo · doble muralla · hipódromo 100.000 · Estambul · UNESCO 1985"}, {"id": "religion", "t": "7. Las disputas religiosas", "tr": "Религиозные споры", "pts": ["La Iglesia tuvo un papel muy destacado y el poder político y religioso estaban unidos.", "<b>Iconoclastia<\/b> (s. VIII, desde <b>726<\/b>): los emperadores <b>prohibieron el culto a los iconos<\/b> (imágenes religiosas) porque lo consideraban <b>idolatría<\/b>. Hubo dos bandos (partidarios y detractores), pero la <b>presión de los monjes y del pueblo<\/b> obligó a derogar la prohibición (843).", "Las diferencias entre el cristianismo romano y el griego llevaron en <b>1054<\/b> al <b>Cisma de Oriente<\/b>: ruptura definitiva entre la <b>Iglesia romana<\/b> (católica, bajo el <b>papa<\/b>) y la <b>Iglesia bizantina u ortodoxa<\/b> (bajo el <b>patriarca de Constantinopla<\/b>). Fue la crisis más profunda del Imperio.", "Los <b>monjes ortodoxos evangelizaron a los pueblos del este de Europa<\/b> (eslavos). Al adaptar el alfabeto griego a sus lenguas surgió en el s. X el <b>alfabeto cirílico<\/b>."], "ru": "Иконоборчество (VIII в., с 726 г.): императоры запретили почитание икон как идолопоклонство, но под давлением монахов и народа запрет отменили. 1054 — Великий раскол: католическая церковь (папа) и православная (патриарх). Монахи крестили славян; появилась кириллица (X в.).", "key": "iconoclastia 726 · idolatría · monjes · Cisma de Oriente 1054 · papa / patriarca · ortodoxa · cirílico"}, {"id": "arte", "t": "8. Cultura y arte", "tr": "Культура и искусство", "pts": ["Al principio mantuvo las formas de vida romanas, pero tras Justiniano adoptó elementos <b>griegos<\/b>: el <b>griego sustituyó al latín<\/b> y el título de césar al de basileus.", "Por su situación y su comercio recibió influencias de Europa occidental, del mundo islámico y de Asia. Fue el <b>centro cultural de referencia del Mediterráneo<\/b>.", "<b>Arte suntuoso<\/b> (lujoso): iglesias con <b>planta de cruz griega cubierta con una cúpula<\/b>, como <b>Santa Sofía<\/b>. También <b>San Vital<\/b> y <b>San Apolinar in Classe<\/b> en <b>Rávena<\/b> (Italia) y San Marcos de Venecia.", "Edificios <b>sobrios por fuera<\/b> y ricamente decorados por dentro con <b>mosaicos<\/b> (hechos con <b>teselas<\/b>, piezas pequeñas de vidrio o cerámica de colores y oro) e <b>iconos<\/b> (imágenes sagradas sobre madera con fondo dorado).", "Elementos: <b>cúpula<\/b>, <b>bóveda<\/b> (techo curvo), <b>arco de medio punto<\/b>, planta de cruz griega o basilical.", "Figuras: <b>colores vivos<\/b>, fondo dorado, <b>sin volumen<\/b>, <b>rígidas, frontales e inexpresivas<\/b>; temas religiosos y elogio del emperador.", "Mosaicos de San Vital: Justiniano y Teodora con su corte, oro, púrpura y joyas → ejemplo de arte suntuoso."], "ru": "После Юстиниана греческий язык заменил латынь. Пышное искусство: храмы в плане греческого креста с куполом (Святая София, Сан-Витале и Сант-Аполлинаре в Равенне). Снаружи скромно, внутри мозаики из смальты и иконы. Фигуры плоские, застывшие, фронтальные, на золотом фоне.", "key": "griego · cruz griega + cúpula · Santa Sofía · San Vital (Rávena) · mosaicos (teselas) · iconos · fondo dorado"}, {"id": "economia", "t": "9. Economía (resumen del profesor)", "tr": "Экономика", "pts": ["La <b>agricultura<\/b> era la actividad principal; grandes propiedades (latifundios).", "La <b>artesanía<\/b> era muy importante: <b>sedas, perfumes y jabones<\/b>.", "El <b>comercio<\/b> fue muy importante hasta el s. XI: en <b>Constantinopla se unían las rutas de Oriente y Occidente<\/b>. Vendían telas, vinos y productos elaborados; recibían pieles, marfil, esclavos y artículos de lujo (especias, piedras preciosas, perfumes) de China e India.", "El <b>sólido<\/b> de oro fue la base del comercio mediterráneo."], "ru": "Сельское хозяйство — основа; важное ремесло (шёлк, духи, мыло); торговля через Константинополь между Востоком и Западом; золотой солид.", "key": "agricultura · sedas, perfumes, jabones · rutas Oriente–Occidente · sólido"}], "timeline": [[330, "Constantino funda Constantinopla sobre Bizancio", "Константин основывает Константинополь"], [395, "Teodosio divide el Imperio romano", "Феодосий делит Римскую империю"], [476, "Fin del Imperio romano de Occidente (comienza la Edad Media)", "Падение Западной Римской империи"], [527, "Empieza el reinado de Justiniano y Teodora (527–565)", "Начало правления Юстиниана и Феодоры"], [533, "Justiniano conquista el norte de África a los vándalos", "Юстиниан отвоёвывает Северную Африку"], [537, "Se consagra la iglesia de Santa Sofía", "Освящение Святой Софии"], [552, "Los bizantinos se instalan en el sur de Hispania (Cartagena)", "Византийцы на юге Испании"], [565, "Muere Justiniano: fin del esplendor", "Смерть Юстиниана"], [726, "Se prohíbe el culto a las imágenes (iconoclastia)", "Запрет почитания икон"], [1054, "Cisma de Oriente: Iglesia católica y ortodoxa", "Великий раскол церквей"], [1203, "Primera conquista de Constantinopla por los cruzados", "Первое взятие Константинополя крестоносцами"], [1453, "Los turcos (Mehmet II) toman Constantinopla: fin del Imperio", "Турки берут Константинополь"], [1985, "El centro histórico de Estambul, Patrimonio de la Humanidad", "Центр Стамбула — наследие ЮНЕСКО"]], "tlcore": [395, 476, 527, 565, 726, 1054, 1203, 1453], "pyramid": {"levels": ["1º · Arriba", "2º · En medio", "3º · Abajo"], "items": [["Nobleza terrateniente", 0], ["Grandes propietarios (latifundios)", 0], ["Altos cargos de la Administración y del Ejército", 0], ["Campesinos con tierras", 1], ["Soldados que reciben tierra por proteger una provincia", 1], ["Colonos", 2], ["Libres que trabajan tierras ajenas por dinero o cosecha", 2]]}, "cities": {"Constantinopla": [28.98, 41.01, "capital del Imperio, en el Bósforo (hoy Estambul)"], "Roma": [12.5, 41.9, "antigua capital de Occidente; reconquistada por Justiniano"], "Rávena": [12.2, 44.42, "mosaicos de San Vital y San Apolinar in Classe"], "Cartago": [10.32, 36.85, "norte de África, conquistada a los vándalos (533)"], "Cartagena": [-0.99, 37.6, "principal ciudad bizantina en Hispania"], "Málaga": [-4.42, 36.72, "costa sur de Hispania, bizantina con Justiniano"], "Ceuta": [-5.31, 35.89, "hoy territorio español; fue bizantina"], "Alejandría": [29.92, 31.2, "gran ciudad de Egipto, perdida ante los musulmanes"], "Antioquía": [36.16, 36.2, "gran ciudad de Siria"], "Damasco": [36.3, 33.51, "ciudad importante (Siria)"], "Jerusalén": [35.23, 31.78, "Palestina, perdida ante los musulmanes"], "Atenas": [23.73, 37.98, "Grecia"], "Tesalónica": [22.94, 40.64, "segunda ciudad del Imperio (Grecia)"], "Éfeso": [27.34, 37.94, "ciudad de Asia Menor"], "Trebisonda": [39.72, 41.0, "costa del mar Negro (Asia Menor)"]}, "cards": [["Basileus", "Título del emperador bizantino: concentraba todos los poderes (ejército, Administración, jefe religioso).", "Базилевс — император со всей властью"], ["Teodosio", "Emperador romano que en el 395 dividió el Imperio entre sus hijos Honorio y Arcadio.", "Феодосий — разделил империю в 395 г."], ["Arcadio", "Hijo de Teodosio que recibió el Imperio de Oriente (capital Constantinopla).", "Аркадий — получил Восток"], ["Honorio", "Hijo de Teodosio que recibió el Imperio de Occidente (capital Roma).", "Гонорий — получил Запад"], ["Constantino", "Emperador romano que fundó Constantinopla en el 330 sobre Bizancio.", "Константин — основал Константинополь (330)"], ["Justiniano", "Emperador bizantino (527–565). Época de esplendor: conquistas, Código de Justiniano, Santa Sofía.", "Юстиниан — расцвет империи"], ["Teodora", "Esposa de Justiniano, gobernó con él. Aparece en los mosaicos de San Vital de Rávena.", "Феодора — жена Юстиниана"], ["Belisario", "General de Justiniano que dirigió las conquistas (África, Italia).", "Велисарий — полководец Юстиниана"], ["Mehmet II", "Sultán turco que conquistó Constantinopla en 1453.", "Мехмед II — взял Константинополь в 1453 г."], ["Código de Justiniano", "Recopilación de leyes romanas (y bizantinas); las mismas leyes en todo el Imperio.", "Кодекс Юстиниана — свод законов"], ["Thema", "Provincia del Imperio bizantino, gobernada por un estratega a las órdenes del emperador.", "Фема — провинция"], ["Estratega", "Gobernador militar de un thema (provincia).", "Стратег — правитель фемы"], ["Cuerpo diplomático", "Se ocupaba de establecer relaciones con otros pueblos y territorios.", "Дипломатическая служба"], ["Red de funcionarios", "Muy extensa, especializados y con gran formación intelectual.", "Сеть образованных чиновников"], ["Sólido", "Moneda de oro bizantina, base del comercio mediterráneo durante siglos.", "Солид — золотая монета"], ["Constantinopla", "Capital del Imperio bizantino, en el Bósforo, entre Europa y Asia. Hoy Estambul.", "Константинополь — столица, сейчас Стамбул"], ["Bizancio", "Antigua ciudad sobre la que se construyó Constantinopla; da nombre al Imperio.", "Византий — древний город"], ["Bósforo", "Estrecho donde está Constantinopla; une el mar Negro con el de Mármara, entre Europa y Asia.", "Босфор — пролив"], ["Hipódromo", "Gran construcción de Constantinopla para carreras, con capacidad para unas 100.000 personas.", "Ипподром на 100 000 человек"], ["Cisterna de Aecio", "Gran depósito para almacenar agua en Constantinopla; aún se conserva.", "Цистерна — хранилище воды"], ["Murallas de Teodosio", "Doble cinturón de murallas que protegía Constantinopla por tierra.", "Стены Феодосия"], ["Estambul", "Nombre actual de Constantinopla (Turquía). Centro histórico Patrimonio de la Humanidad desde 1985.", "Стамбул — ЮНЕСКО с 1985 г."], ["Patriarca de Constantinopla", "Máxima autoridad religiosa de la Iglesia bizantina u ortodoxa.", "Патриарх — глава православной церкви"], ["Nobleza terrateniente", "1º de la pirámide: grandes propietarios (latifundios) con los altos cargos de la Administración y del Ejército.", "Знать-землевладельцы — верх пирамиды"], ["Campesinos con tierras", "2º de la pirámide: pequeños propietarios; también soldados a los que se daba tierra por proteger una provincia.", "Крестьяне с землёй — середина пирамиды"], ["Colono", "3º (abajo) de la pirámide: hombre libre que trabajaba las tierras de un propietario a cambio de dinero o cosecha.", "Колон — свободный арендатор, низ пирамиды"], ["Gremio", "Asociación de artesanos de un mismo oficio con las mismas normas.", "Цех ремесленников"], ["Latifundio", "Gran propiedad de tierra.", "Латифундия — крупное поместье"], ["Organización urbana", "El Imperio heredó de Roma las ciudades: centros de gobierno, ejército, obispados, talleres y mercados.", "Городская организация"], ["Iconoclastia", "Prohibición del culto a los iconos (s. VIII, desde 726) por considerarlo idolatría.", "Иконоборчество"], ["Icono", "Imagen religiosa pintada sobre madera, con fondo dorado.", "Икона"], ["Cisma de Oriente", "1054: ruptura entre la Iglesia romana (papa) y la ortodoxa (patriarca de Constantinopla).", "Великий раскол 1054 г."], ["Iglesia ortodoxa", "Iglesia bizantina, bajo la autoridad del patriarca de Constantinopla.", "Православная церковь"], ["Alfabeto cirílico", "Surge en el s. X al adaptar el alfabeto griego a las lenguas eslavas.", "Кириллица"], ["Griego", "Lengua que sustituyó al latín en el Imperio bizantino tras Justiniano.", "Греческий язык заменил латынь"], ["Santa Sofía", "Gran iglesia de Constantinopla levantada por Justiniano; planta de cruz griega y enorme cúpula.", "Святая София"], ["San Vital de Rávena", "Iglesia bizantina en Italia con mosaicos de Justiniano y Teodora.", "Сан-Витале в Равенне"], ["San Apolinar in Classe", "Iglesia bizantina en Rávena (Italia).", "Сант-Аполлинаре ин Классе"], ["Mosaico", "Decoración hecha con teselas de colores; cubría paredes y cúpulas de las iglesias.", "Мозаика"], ["Teselas", "Piezas pequeñas de vidrio, piedra o cerámica con las que se hacen los mosaicos.", "Смальта / тессеры"], ["Cúpula", "Cubierta semiesférica (un tipo de bóveda), típica de las iglesias bizantinas.", "Купол"], ["Bóveda", "Techo curvo de piedra o ladrillo que cubre un espacio.", "Свод"], ["Planta de cruz griega", "Planta de iglesia en forma de cruz con los cuatro brazos iguales.", "План в виде греческого креста"], ["Arte suntuoso", "Arte lujoso y rico: oro, mosaicos, joyas, materiales caros.", "Пышное, роскошное искусство"], ["Lombardos", "Pueblo germano que en el s. VI expulsó a los bizantinos del norte y centro de Italia.", "Лангобарды"], ["Turcos", "Pueblo que conquistó gran parte del Imperio y en 1453 tomó Constantinopla.", "Турки"]], "quiz": [{"q": "¿En qué año dividió Teodosio el Imperio romano?", "a": "395", "w": ["476", "330", "527"], "e": "En el 395 Teodosio dividió el Imperio en Occidente (Roma) y Oriente (Constantinopla).", "topic": "origen"}, {"q": "¿Qué hijo de Teodosio recibió el Imperio de Oriente?", "a": "Arcadio", "w": ["Honorio", "Justiniano", "Constantino"], "e": "Arcadio recibió Oriente; Honorio, Occidente.", "topic": "origen"}, {"q": "¿Por qué dividió Teodosio el Imperio?", "a": "Para facilitar su defensa ante la crisis y la amenaza germana", "w": ["Porque lo ordenó el papa", "Porque los turcos habían conquistado Roma", "Para tener dos capitales más bonitas"], "e": "Ante la grave crisis y la amenaza germana, lo dividió para defenderlo mejor.", "topic": "origen"}, {"q": "¿Cuánto tiempo pervivió el Imperio bizantino?", "a": "Más de mil años (395–1453)", "w": ["Unos 300 años", "Unos 100 años", "Unos 500 años"], "e": "1453 − 395 = 1058 años: «más de mil años».", "topic": "origen"}, {"q": "¿De dónde viene el nombre «bizantino»?", "a": "De Bizancio, la antigua ciudad sobre la que se fundó Constantinopla", "w": ["De un emperador llamado Bizancio", "De la palabra griega «oro»", "De los bizantes, un pueblo germano"], "e": "Constantinopla se construyó sobre la antigua Bizancio.", "topic": "origen"}, {"q": "¿Qué era el basileus?", "a": "El emperador, que concentraba todos los poderes", "w": ["El jefe de la Iglesia de Roma", "Un general del ejército", "El gobernador de una provincia"], "e": "Basileus = emperador: dirigía ejército y Administración y era jefe religioso.", "topic": "gobierno"}, {"q": "¿Qué NO hacía el basileus?", "a": "Obedecer al papa de Roma", "w": ["Dirigir el ejército", "Dirigir la Administración", "Ser el jefe religioso"], "e": "El basileus era jefe religioso; no dependía del papa.", "topic": "gobierno"}, {"q": "¿Quién se ocupaba de las relaciones con otros pueblos?", "a": "El cuerpo diplomático", "w": ["La red de funcionarios", "Los gremios", "El hipódromo"], "e": "El cuerpo diplomático establecía relaciones con otros pueblos y territorios.", "topic": "gobierno"}, {"q": "¿Qué era el Código de Justiniano?", "a": "Una recopilación de leyes vigente en todo el Imperio", "w": ["Un libro de oraciones", "Un mapa del Imperio", "Un tratado de paz con los persas"], "e": "Recogía las leyes romanas; en todo el Imperio regían las mismas leyes.", "topic": "gobierno"}, {"q": "¿Qué era un thema?", "a": "Una provincia gobernada por un estratega", "w": ["Una iglesia con cúpula", "Una moneda de oro", "Un impuesto"], "e": "El territorio se dividía en themas o provincias.", "topic": "gobierno"}, {"q": "¿Cuándo reinó Justiniano?", "a": "527–565", "w": ["395–476", "726–843", "1054–1203"], "e": "Justiniano y Teodora gobernaron entre 527 y 565.", "topic": "justiniano"}, {"q": "¿Con quién gobernó Justiniano?", "a": "Con su esposa Teodora", "w": ["Con su hermano Arcadio", "Con el papa", "Con Mehmet II"], "e": "Gobernó junto con su esposa Teodora.", "topic": "justiniano"}, {"q": "¿Qué quería conseguir Justiniano con sus conquistas?", "a": "Reconstruir la unidad del antiguo Imperio romano", "w": ["Conquistar la India", "Convertir a los vikingos", "Trasladar la capital a Roma"], "e": "Trató de reconstruir la unidad del antiguo Imperio romano.", "topic": "justiniano"}, {"q": "¿A quién venció el ejército de Justiniano en el norte de África?", "a": "A los vándalos", "w": ["A los visigodos", "A los lombardos", "A los turcos"], "e": "Vándalos en África, ostrogodos en Italia, visigodos en el sur de Hispania.", "topic": "justiniano"}, {"q": "¿A quién venció Justiniano en Italia?", "a": "A los ostrogodos", "w": ["A los vándalos", "A los francos", "A los persas"], "e": "En Italia venció a los ostrogodos.", "topic": "justiniano"}, {"q": "¿Qué moneda de oro se acuñó y circuló por toda Europa?", "a": "El sólido", "w": ["El dinar", "El denario de plata", "El florín"], "e": "El sólido fue el principal medio de pago en Europa durante mucho tiempo.", "topic": "justiniano"}, {"q": "¿Por qué el reinado de Justiniano fue un periodo de esplendor?", "a": "Por las conquistas, la prosperidad económica y el desarrollo cultural", "w": ["Porque no hubo guerras", "Porque se convirtió al islam", "Porque se trasladó a Roma"], "e": "Esplendor militar (conquistas), económico (comercio, sólido) y cultural (Santa Sofía, Código).", "topic": "justiniano"}, {"q": "¿Qué territorios actuales de España fueron bizantinos?", "a": "La costa sur y sureste (Málaga, Cartagena), Baleares y Ceuta", "w": ["Galicia y Asturias", "Cataluña y Aragón", "Toda la Meseta"], "e": "Mira el mapa de la p. 23: sur y sureste peninsular, Baleares y Ceuta.", "topic": "territorios"}, {"q": "¿Quién expulsó a los bizantinos de la península ibérica?", "a": "Los visigodos (siglo VII)", "w": ["Los musulmanes (siglo VIII)", "Los francos (siglo IX)", "Los romanos (siglo V)"], "e": "En el s. VII los visigodos expulsaron a los bizantinos del sur de Hispania.", "topic": "territorios"}, {"q": "¿Quién expulsó a los bizantinos del norte y centro de Italia?", "a": "Los lombardos (siglo VI)", "w": ["Los visigodos", "Los turcos", "Los vikingos"], "e": "En el s. VI los lombardos los expulsaron del norte y centro de Italia.", "topic": "territorios"}, {"q": "¿Qué conquistaron los musulmanes en los siglos VII y VIII?", "a": "Egipto, la costa de África, Siria y Palestina", "w": ["Grecia y los Balcanes", "Constantinopla", "Italia"], "e": "Los musulmanes quitaron al Imperio Egipto, el norte de África, Siria y Palestina.", "topic": "territorios"}, {"q": "¿Qué territorio formaba el Imperio a principios del siglo XV?", "a": "Solo la ciudad de Constantinopla (y poco más)", "w": ["Todo el Mediterráneo", "Italia y Grecia", "Egipto y Siria"], "e": "Estaba reducido al territorio de la ciudad de Constantinopla.", "topic": "territorios"}, {"q": "¿En qué año cayó Constantinopla?", "a": "1453", "w": ["1054", "1203", "1492"], "e": "En 1453 los turcos tomaron Constantinopla: fin del Imperio bizantino.", "topic": "territorios"}, {"q": "¿Quién conquistó Constantinopla en 1453?", "a": "Los turcos del sultán Mehmet II", "w": ["Los cruzados", "Carlomagno", "Los persas"], "e": "Tras un largo asedio, los turcos de Mehmet II.", "topic": "territorios"}, {"q": "¿Qué ocurrió en 1203 según la línea del tiempo?", "a": "Primera conquista de Constantinopla por los cruzados", "w": ["Cisma de Oriente", "Prohibición de las imágenes", "Fin del Imperio bizantino"], "e": "1203: primera conquista de Constantinopla por los cruzados.", "topic": "territorios"}, {"q": "¿Quién estaba por encima de toda la sociedad bizantina?", "a": "El emperador (basileus)", "w": ["Los colonos", "Los comerciantes", "Los soldados"], "e": "El basileus estaba por encima de todos; debajo, la pirámide social.", "topic": "sociedad"}, {"q": "¿Quién era la máxima autoridad de la Iglesia bizantina u ortodoxa?", "a": "El patriarca de Constantinopla", "w": ["El papa de Roma", "El estratega", "El sultán"], "e": "El patriarca de Constantinopla (la Iglesia católica, el papa).", "topic": "religion"}, {"q": "¿Quién formaba el primer escalón (arriba) de la pirámide?", "a": "La nobleza terrateniente: grandes propietarios con altos cargos", "w": ["Los colonos", "Los artesanos de los gremios", "Los soldados con tierras"], "e": "1º nobleza terrateniente (latifundios, altos cargos de la Administración y el Ejército).", "topic": "sociedad"}, {"q": "¿Quiénes formaban el escalón de abajo (3º) de la pirámide?", "a": "Los colonos", "w": ["La nobleza terrateniente", "Los campesinos con tierras", "Los funcionarios"], "e": "Colonos: libres que trabajaban tierras ajenas a cambio de dinero o cosecha.", "topic": "sociedad"}, {"q": "¿Por qué aumentaron los campesinos con tierras?", "a": "Porque a los soldados se les daba un trozo de tierra a cambio de proteger una provincia", "w": ["Porque el emperador regalaba tierras a t el hipódromo?", "a": "Unas 100.000", "w": ["Unas 1.000", "Unas 10.000", "Un millón"], "e": "Hipódromo con cabida para unas 100.000 personas.", "topic": "constantinopla"}, {"q": "¿Cuántos habitantes tenía Constantinopla con Justiniano?", "a": "Medio millón", "w": ["Diez mil", "Cinco millones", "Cien mil"], "e": "Alcanzó el medio millón de habitantes.", "topic": "constantinopla"}, {"q": "¿Para qué servía la cisterna de Aecio?", "a": "Para almacenar agua", "w": ["Para guardar el oro", "Como iglesia", "Como puerto"], "e": "Construcción imponente para almacenar agua; aún se conserva.", "topic": "constantinopla"}, {"q": "¿Desde cuándo es Patrimonio de la Humanidad el centro histórico de Estambul?", "a": "Desde 1985", "w": ["Desde 1453", "Desde 2020", "Desde 1934"], "e": "Zonas históricas de Estambul, UNESCO 1985.", "topic": "constantinopla"}, {"q": "¿Qué funciones ha tenido Santa Sofía?", "a": "Iglesia, mezquita, museo y otra vez mezquita", "w": ["Solo iglesia", "Palacio y cárcel", "Hipódromo y mercado"], "e": "Iglesia (537), mezquita (1453), museo (1934), mezquita (2020).", "topic": "constantinopla"}, {"q": "¿Qué fue la iconoclastia?", "a": "La prohibición del culto a los iconos en el siglo VIII", "w": ["La construcción de Santa Sofía", "La división del Imperio", "La conquista de Italia"], "e": "Los emperadores prohibieron el culto a los iconos (desde 726).", "topic": "religion"}, {"q": "¿Por qué se prohibió el culto a las imágenes?", "a": "Porque se consideraba idolatría alejada del cristianismo", "w": ["Porque los iconos eran muy caros", "Porque lo pidió el papa", "Porque los turcos lo exigieron"], "e": "Lo consideraban idolatría.", "topic": "religion"}, {"q": "¿Quién obligó a derogar la prohibición de los iconos?", "a": "La presión de los monjes y de los grupos populares", "w": ["El papa de Roma", "Los turcos", "Carlomagno"], "e": "Libro, p. 25.", "topic": "religion"}, {"q": "¿En qué año fue el Cisma de Oriente?", "a": "1054", "w": ["726", "1203", "1453"], "e": "1054: ruptura definitiva entre las Iglesias.", "topic": "religion"}, {"q": "¿Qué fue el Cisma de Oriente?", "a": "La ruptura entre la Iglesia romana (papa) y la ortodoxa (patriarca)", "w": ["La división del Imperio por Teodosio", "Una guerra contra los persas", "La caída de Constantinopla"], "e": "Iglesia católica (papa de Roma) / ortodoxa (patriarca de Constantinopla).", "topic": "religion"}, {"q": "¿A quién evangelizaron los monjes ortodoxos?", "a": "A los pueblos del este de Europa (eslavos)", "w": ["A los vikingos de Escandinavia", "A los musulmanes", "A los francos"], "e": "Al adaptar el griego a sus lenguas surgió el alfabeto cirílico (s. X).", "topic": "religion"}, {"q": "¿Qué lengua sustituyó al latín en el Imperio bizantino?", "a": "El griego", "w": ["El árabe", "El turco", "El germano"], "e": "Tras Justiniano el griego sustituyó al latín.", "topic": "arte"}, {"q": "¿Cómo era la planta de las iglesias bizantinas?", "a": "De cruz griega, cubierta con una cúpula", "w": ["Circular sin techo", "Cuadrada con tejado de paja", "De herradura"], "e": "Planta de cruz griega con cúpula, como Santa Sofía.", "topic": "arte"}, {"q": "¿Dónde están San Vital y San Apolinar in Classe?", "a": "En Rávena (Italia)", "w": ["En Constantinopla", "En Toledo", "En Atenas"], "e": "Ambas en Rávena.", "topic": "arte"}, {"q": "¿Cómo eran los edificios bizantinos?", "a": "Sobrios por fuera y decorados con mosaicos e iconos por dentro", "w": ["Muy decorados por fuera y vacíos por dentro", "De madera y paja", "Sin ventanas ni cúpulas"], "e": "Exterior sobrio, interior suntuoso.", "topic": "arte"}, {"q": "¿Con qué se hacen los mosaicos?", "a": "Con teselas", "w": ["Con ladrillos grandes", "Con madera", "Con tela"], "e": "Teselas: piezas pequeñas de vidrio o cerámica de colores.", "topic": "arte"}, {"q": "¿Cómo son las figuras del arte bizantino?", "a": "Rígidas, frontales, sin volumen y sobre fondo dorado", "w": ["Muy realistas y en movimiento", "Abstractas, sin personas", "En blanco y negro"], "e": "Colores vivos, fondo dorado, rigidez, frontalidad.", "topic": "arte"}, {"q": "¿Qué significa «arte suntuoso»?", "a": "Arte lujoso, con materiales ricos como el oro", "w": ["Arte sencillo y pobre", "Arte de la Edad de Piedra", "Arte hecho solo de madera"], "e": "Suntuoso = lujoso.", "topic": "arte"}, {"q": "¿Qué productos artesanos eran famosos?", "a": "Sedas, perfumes y jabones", "w": ["Armas de hierro y cerveza", "Papel y pólvora", "Patatas y tomates"], "e": "Resumen del profesor, economía.", "topic": "economia"}, {"q": "¿Por qué Constantinopla era tan rica?", "a": "Porque unía las rutas comerciales de Oriente y Occidente", "w": ["Porque tenía minas de oro", "Porque cobraba impuestos a Roma", "Porque no tenía ejército"], "e": "Situada entre Europa y Asia, controlaba el comercio.", "topic": "economia"}], "tf": [["El Imperio bizantino era el antiguo Imperio romano de Oriente.", true, "Sí: el Imperio romano de Oriente pasó a llamarse bizantino."], ["La capital del Imperio bizantino era Roma.", false, "Era Constantinopla."], ["El basileus solo tenía poder militar.", false, "Concentraba todos los poderes: ejército, Administración y religión."], ["Justiniano quiso reconstruir el antiguo Imperio romano.", true, "Por eso conquistó África, Italia y el sur de Hispania."], ["Los bizantinos nunca llegaron a la península ibérica.", false, "Ocuparon la costa sur y sureste (Cartagena, Málaga) en el s. VI."], ["Las conquistas de Justiniano se conservaron muchos siglos.", false, "No se conservaron mucho tiempo."], ["La sociedad bizantina tenía una estructura piramidal.", true, "Basileus por encima; 1º nobleza terrateniente, 2º campesinos con tierras, 3º colonos."], ["Los colonos estaban en el escalón más alto de la pirámide.", false, "Estaban abajo (3º); arriba estaba la nobleza terrateniente."], ["A los soldados se les daba un trozo de tierra a cambio de proteger una provincia.", true, "Por eso aumentaron los campesinos con tierras (2º escalón)."], ["La organización del Imperio bizantino era urbana.", true, "Heredó de Roma la importancia de las ciudades."], ["En la iconoclastia se prohibió el culto a las imágenes.", true, "Desde el 726, por considerarlo idolatría."], ["El Cisma de Oriente unió la Iglesia de Roma y la de Constantinopla.", false, "Las separó definitivamente (1054)."], ["En el Imperio bizantino el latín sustituyó al griego.", false, "Al revés: el griego sustituyó al latín."], ["Santa Sofía tiene planta de cruz griega y una gran cúpula.", true, "Es el gran ejemplo del arte bizantino."], ["Los edificios bizantinos eran muy decorados por fuera.", false, "Eran sobrios por fuera y ricos por dentro."], ["Constantinopla fue conquistada por los turcos en 1453.", true, "Por el sultán Mehmet II."], ["Hoy Constantinopla se llama Atenas.", false, "Se llama Estambul (Turquía)."]], "open": [{"q": "Explica cómo y cuándo surgió el Imperio bizantino.", "a": "El Imperio romano sufría desde el siglo III una grave crisis y la amenaza de los germanos. Para facilitar su defensa, en el año 395 el emperador Teodosio lo dividió entre sus hijos: Honorio recibió el Imperio de Occidente (capital Roma) y Arcadio el de Oriente (capital Constantinopla). Occidente cayó en el 476, pero Oriente se mantuvo más de mil años con el nombre de Imperio bizantino, hasta 1453.", "k": ["crisis / amenaza germana", "395", "Teodosio", "Honorio – Occidente – Roma", "Arcadio – Oriente – Constantinopla", "más de mil años / 1453"]}, {"q": "Explica quién era el basileus y qué papel desempeñó en el Imperio bizantino.", "a": "El basileus era el emperador bizantino. Estaba en la cúspide de la organización y concentraba todos los poderes: dirigía el ejército y la Administración y era el jefe religioso; se creía que su poder venía de Dios. Se apoyaba en una extensa red de funcionarios bien formados, en un cuerpo diplomático que trataba con otros pueblos y en un poderoso ejército que defendía las fronteras. En todo el Imperio regían las mismas leyes, recogidas en el Código de Justiniano.", "k": ["emperador", "todos los poderes", "ejército y Administración", "jefe religioso", "funcionarios / diplomáticos / ejército", "Código de Justiniano"]}, {"q": "Analiza por qué el reinado de Justiniano y Teodora fue un periodo de gran esplendor.", "a": "Justiniano gobernó con su esposa Teodora entre 527 y 565. Fue un periodo de esplendor militar, porque quiso reconstruir la unidad del antiguo Imperio romano y venció a los vándalos en el norte de África, a los ostrogodos en Italia y a los visigodos en el sur de Hispania. También fue una etapa de prosperidad económica: se embelleció Constantinopla, creció el comercio por el Mediterráneo y se acuñó el sólido de oro. Por último, hubo un gran desarrollo cultural: se construyó Santa Sofía y se recopiló el Código de Justiniano.", "k": ["527–565", "Teodora", "reconstruir el Imperio romano", "vándalos / ostrogodos / visigodos", "comercio y sólido", "Santa Sofía / Código"]}, {"q": "Observa el mapa y enumera los territorios del Imperio bizantino y los que conquistó Justiniano. ¿Qué territorios actuales de España fueron bizantinos?", "a": "A la llegada de Justiniano (527) el Imperio comprendía Grecia, los Balcanes, Asia Menor, Siria, Palestina y Egipto. Justiniano conquistó el norte de África, la península itálica, las islas de Sicilia, Cerdeña, Córcega y Baleares y el sur y sureste de la península ibérica. Los territorios actuales de España que fueron bizantinos son la costa sur y sureste (Málaga, Cartagena), las Islas Baleares y Ceuta.", "k": ["Grecia, Balcanes, Asia Menor", "Siria, Palestina, Egipto", "norte de África", "Italia", "Baleares y otras islas", "sur y sureste de Hispania / Ceuta"]}, {"q": "Describe cómo se produjo el declive del Imperio. ¿Cuándo desapareció? ¿Por qué?", "a": "Los territorios de Justiniano no se conservaron mucho tiempo. Las crisis económica, política y militar provocaron luchas dinásticas y ataques de pueblos extranjeros: en el siglo VI los lombardos expulsaron a los bizantinos de Italia; en el VII los visigodos los echaron de Hispania; en los siglos VII y VIII los musulmanes conquistaron Egipto, la costa de África, Siria y Palestina. Después los turcos ocuparon gran parte del territorio y a principios del siglo XV solo quedaba Constantinopla. En 1453, tras un largo asedio, los turcos del sultán Mehmet II conquistaron la capital y el Imperio desapareció.", "k": ["crisis y luchas dinásticas", "lombardos (Italia)", "visigodos (Hispania)", "musulmanes (Egipto, Siria...)", "turcos", "1453 – Mehmet II"]}, {"q": "Dibuja y explica la pirámide de la sociedad bizantina.", "a": "Por encima de todos estaba el emperador o basileus. Debajo, la sociedad formaba una pirámide. En el primer escalón estaba la nobleza terrateniente: propietarios de grandes tierras (latifundios) que ocupaban los altos cargos de la Administración y del Ejército. En el segundo, los campesinos con tierras, cada vez más numerosos porque a los soldados se les daba un trozo de tierra a cambio de proteger una provincia. En el tercero, los colonos, hombres libres que trabajaban las tierras de los propietarios a cambio de dinero o de parte de la cosecha. Con la crisis del siglo XI los grandes propietarios se quedaron con las tierras de los pequeños campesinos endeudados. En las ciudades vivían funcionarios, grandes propietarios, comerciantes y artesanos organizados en gremios.", "k": ["basileus por encima", "1º nobleza terrateniente (latifundios, altos cargos)", "2º campesinos con tierras (soldados)", "3º colonos (libres, dinero o cosecha)", "crisis del s. XI", "ciudades: comerciantes y artesanos en gremios"]}, {"q": "Explica el papel de las ciudades en el Imperio bizantino. ¿Se parecía al de las ciudades del antiguo Imperio romano?", "a": "El Imperio bizantino heredó de Roma una organización eminentemente urbana. Ciudades como Constantinopla, Alejandría, Tesalónica, Damasco y Éfeso siguieron siendo importantes y conservaron sus funciones romanas. Eran centros económicos donde estaban las instituciones de gobierno, del ejército y de los obispados, los talleres artesanales y los mercados, y desde ellas se organizaba un intenso comercio exterior. Por eso sí se parecía a las ciudades romanas, a diferencia de Occidente, donde las ciudades se despoblaron.", "k": ["urbana, heredada de Roma", "Alejandría, Tesalónica, Damasco, Éfeso", "gobierno, ejército, obispados", "talleres y mercados", "comercio exterior", "sí se parecía"]}, {"q": "Describe Constantinopla. ¿Cómo se llama hoy y desde cuándo es Patrimonio de la Humanidad? ¿Por qué?", "a": "Constantinopla fue fundada por el emperador Constantino en el 330 sobre la antigua Bizancio. Estaba en el estrecho del Bósforo y controlaba las rutas comerciales entre Europa y Asia. Con Justiniano tuvo medio millón de habitantes. Estaba protegida por una doble muralla y tenía el palacio imperial, la iglesia de Santa Sofía, el hipódromo para 100.000 personas, foros y la cisterna de Aecio. Hoy se llama Estambul (Turquía) y su centro histórico es Patrimonio de la Humanidad desde 1985 por sus monumentos únicos y por ser punto de encuentro entre Europa y Asia y entre el arte bizantino y el otomano.", "k": ["Constantino, 330, Bizancio", "Bósforo, Europa–Asia", "medio millón", "murallas, Santa Sofía, hipódromo", "Estambul", "1985 y por qué"]}, {"q": "Explica las disputas religiosas del Imperio bizantino.", "a": "La Iglesia tuvo un papel muy importante y fue motivo de disputas. En el siglo VIII los emperadores prohibieron el culto a los iconos porque lo consideraban idolatría (iconoclastia); hubo dos bandos, pero la presión de los monjes y del pueblo obligó a derogar la prohibición. Las diferencias entre el cristianismo romano y el griego llevaron en 1054 al Cisma de Oriente, la ruptura definitiva entre la Iglesia romana, bajo el papa, y la Iglesia bizantina u ortodoxa, bajo el patriarca de Constantinopla. Los monjes ortodoxos evangelizaron a los pueblos del este de Europa.", "k": ["iconoclastia, s. VIII", "idolatría", "monjes y pueblo", "Cisma de Oriente 1054", "papa / patriarca", "evangelizan el este de Europa"]}, {"q": "Describe la cultura y el arte bizantino.", "a": "Tras Justiniano el Imperio adoptó elementos griegos: el griego sustituyó al latín. Por su situación y su comercio recibió influencias de Occidente, del islam y de Asia y fue el centro cultural del Mediterráneo. Su arte era suntuoso: iglesias con planta de cruz griega cubierta con cúpula, como Santa Sofía, y otras como San Vital y San Apolinar in Classe en Rávena. Eran sobrias por fuera y por dentro se decoraban con mosaicos de teselas e iconos, con figuras rígidas, frontales y sin volumen sobre fondo dorado y colores vivos.", "k": ["griego en vez de latín", "centro cultural del Mediterráneo", "suntuoso", "cruz griega y cúpula", "Santa Sofía / Rávena", "mosaicos e iconos, fondo dorado"]}]};

 $('#ot').oninput=e=>LS.set('ans'+Oi,e.target.value);
 const show=()=>{$('#om').innerHTML=`<div class="model"><b>Respuesta modelo:</b><p style="margin:6px 0 0">${o.a}</p></div><div class="kw" style="margin-top:10px"><b>¿Qué ideas clave has puesto?</b>${o.k.map((k,j)=>`<label><input type="checkbox" data-j="${j}"> ${k}</label>`).join('')}</div><div class="row"><button class="btn" id="og">Guardar y siguiente</button></div><p class="fb" id="okf"></p>`;
  $('#og').onclick=()=>{const n=$('#om').querySelectorAll('input:checked').length;P.open[Oi]=n;save();toast(`${n} / ${o.k.length} ideas clave`);Oi=(Oi+1)%D.open.length;largas()}};
 $('#os').onclick=show;
}

/* -------- 8. exam -------- */
let E=null;
function exam(){
 if(!E){
  $('#main').innerHTML=`<div class="card"><h2>🎯 Examen final</h2><p>20 preguntas mezcladas, como en una prueba real: test, verdadero/falso, fechas, mapa y pirámide. Sin ayudas. Al final verás tu nota sobre 10 y los errores para repasar.</p><div class="ru">20 смешанных вопросов без подсказок. В конце — оценка из 10 и разбор ошибок.</div>
  <div class="grid2" style="margin-top:10px"><div class="stat"><span class="muted">Mejor nota</span><b>${P.best!=null?P.best.toLocaleString('es')+' / 10':'—'}</b></div><div class="stat"><span class="muted">Recomendado</span><b style="font-size:1rem">Haz antes los pasos 1–7</b></div></div>
  <div class="row"><button class="btn" id="es">Empezar el examen</button></div></div>`;
  $('#es').onclick=()=>{E=buildExam();examQ()};return}
 examQ();
}
function buildExam(){
 const it=[];
 shuffle(D.quiz).slice(0,11).forEach(q=>it.push({t:'mc',q:q.q,a:q.a,o:shuffle([q.a,...q.w]),e:q.e}));
 shuffle(D.tf).slice(0,4).forEach(q=>it.push({t:'mc',q:'Verdadero o falso: '+q[0],a:q[1]?'Verdadero':'Falso',o:['Verdadero','Falso'],e:q[2]}));
 shuffle(D.timeline.filter(t=>D.tlcore.includes(t[0]))).slice(0,2).forEach(t=>it.push({t:'yr',q:t[1],a:t[0]}));
 const cn=shuffle(Object.keys(D.cities))[0];it.push({t:'map',q:'Localiza en el mapa: '+cn,n:cn});const tq=TERRQ[Math.floor(Math.random()*TERRQ.length)];it.push({t:'terr',q:tq.q,tq});
 const pi=D.pyramid.items[Math.floor(Math.random()*D.pyramid.items.length)];it.push({t:'mc',q:`¿En qué escalón de la pirámide estaban «${pi[0]}»?`,a:D.pyramid.levels[pi[1]],o:D.pyramid.levels.slice(),e:'Pirámide del resumen del profesor.'});
 return{items:shuffle(it),k:0,ok:0,wrong:[]};
}
function examQ(){
 if(E.k>=E.items.length)return examEnd();
 const q=E.items[E.k];let body='';
 if(q.t==='mc')body=`<div class="opts">${q.o.map(o=>`<button data-o="${esc(o)}">${o}</button>`).join('')}</div>`;
 if(q.t==='yr')body=`<p class="muted">¿En qué año?</p><div class="row"><input class="yr" id="ey" inputmode="numeric" maxlength="4"><button class="btn" id="eyc">Responder</button></div>`;
 if(q.t==='map'||q.t==='terr')body=`<div class="mapwrap"><svg id="map" viewBox="${VB.join(' ')}"></svg></div>`;
 $('#main').innerHTML=`<div class="card"><p class="score">Pregunta ${E.k+1} / ${E.items.length} · aciertos ${E.ok}</p><div class="prog"><i style="width:${E.k/E.items.length*100}%"></i></div><p class="q">${q.q}</p>${body}<div id="ef"></div></div>`;
 const fin=(ok,msg)=>{if(ok)E.ok++;else E.wrong.push({q:q.q,a:msg});$('#ef').innerHTML=`<p class="fb ${ok?'ok':'bad'}">${ok?'¡Correcto!':'Incorrecto. Respuesta: '+msg}</p>${q.e&&!ok?`<p class="expl">${q.e}</p>`:''}<div class="row"><button class="btn" id="en">${E.k+1<E.items.length?'Siguiente':'Ver nota'}</button></div>`;$('#en').onclick=()=>{E.k++;examQ()};$('#en').focus()};
 if(q.t==='mc')$('#main').querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{const ok=b.dataset.o===q.a;$('#main').querySelectorAll('.opts button').forEach(x=>{x.disabled=true;if(x.dataset.o===q.a)x.classList.add('ok')});if(!ok)b.classList.add('bad');fin(ok,q.a)});
 if(q.t==='yr'){const go_=()=>{const v=+$('#ey').value;if(!v)return;$('#eyc').disabled=true;$('#ey').disabled=true;fin(v===q.a,String(q.a))};$('#eyc').onclick=go_;$('#ey').onkeydown=e=>{if(e.key==='Enter')go_()};$('#ey').focus()}
 if(q.t==='map'){mapQ=null;drawMap(false);let done=false;$('#map').onclick=e=>{if(done)return;done=true;const p=svgPt(e);const c=D.cities[q.n];const [x,y]=prj(c[0],c[1]);const ok=cityOk(p,q.n);
  $('#mfx').innerHTML=`<circle cx="${x}" cy="${y}" r="13" fill="none" stroke="${ok?'#2f8f5b':'#d1432f'}" stroke-width="3"/><text x="${x+8}" y="${y-8}" style="font-size:12px;font-weight:800;paint-order:stroke;stroke:#fff;stroke-width:3px">${q.n}</text>`;fin(ok,q.n+' (marcada en el mapa)')}}
 if(q.t==='terr'){mapQ=null;drawMap(true);let done=false;$('#map').onclick=e=>{if(done)return;done=true;const p=svgPt(e);const ok=terrHit(p,q.tq);
  $('#mfx').innerHTML=`<circle cx="${p[0]}" cy="${p[1]}" r="6" fill="${ok?'#2f8f5b':'#d1432f'}" stroke="#fff" stroke-width="2"/>`;fin(ok,q.tq.a)}}
}
function examEnd(){
 const n=E.items.length,g=Math.round(E.ok/n*100)/10;if(P.best==null||g>P.best)P.best=g;save();
 const msg=g>=9?'¡Sobresaliente! Estás lista. 🎉':g>=7?'¡Notable! Repasa los errores y repite.':g>=5?'Aprobado. Repasa las tarjetas y el test de los temas con errores.':'Todavía no. Vuelve a «Aprender» y al test por temas.';
 $('#main').innerHTML=`<div class="card"><h2>Resultado</h2><div class="big">${g.toLocaleString('es')} / 10</div><p>${E.ok} de ${n} correctas. ${msg}</p>
 ${E.wrong.length?`<h3>Para repasar</h3><ul class="res">${E.wrong.map(w=>`<li>${w.q}<br><b style="color:var(--ok)">→ ${w.a}</b></li>`).join('')}</ul>`:''}
 <div class="row"><button class="btn" id="er">Otro examen</button><a class="btn ghost" href="pdf/chuleta-bizantinos.pdf" download style="text-decoration:none">📄 Chuleta PDF</a></div></div>`;
 $('#er').onclick=()=>{E=buildExam();examQ()};
}

renderSteps();go(cur);
</script>
