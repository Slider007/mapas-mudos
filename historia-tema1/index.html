<!doctype html>
<html lang="ru" data-theme="light" style="color-scheme:light">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tema 1 — Fin de la Edad Antigua e inicio de la Edad Media</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏰%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;--sea:#cfe1e8;--ink:#1f3a4d;--ink2:#5b7282;--bg:#f6f8f9;--panel:#fff;--soft:#eef2f4;--line:#bcd5df;--hi:#f2a516;--ok:#2f8f5b;--bad:#d1432f;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.app{max-width:1400px;margin:0 auto;padding:max(8px,env(safe-area-inset-top)) 10px 28px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:6px 4px}
h1{margin:0;font-size:1.25rem;font-weight:800;letter-spacing:-.01em;line-height:1.15}
h1 small{display:block;font-size:.78rem;font-weight:400;color:var(--ink2)}
.sw{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--ink2);cursor:pointer;flex:none}
.modes{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:14px;margin:6px 0}
.modes button{flex:1;border:0;background:none;padding:8px 2px;border-radius:10px;font-size:.84rem;font-weight:600;cursor:pointer}
.modes button[aria-pressed=true]{background:var(--panel);box-shadow:0 0 0 1px var(--line)}
.stage{display:grid;gap:8px}
.parts{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.part{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:5px 10px;font-size:.82rem;cursor:pointer;text-align:left;line-height:1.15}
.part small{display:block;color:var(--ink2);font-size:.7rem}
.part[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}.part[aria-pressed=true] small{color:#cfe1e8}
.opts{display:grid;gap:6px;margin-top:10px}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;text-align:left;cursor:pointer;font-weight:600}
.opt.ok{border-color:var(--ok);background:#e8f5ee}.opt.bad{border-color:var(--bad);background:#fdecea}
.bar{height:8px;border-radius:5px;background:var(--soft);overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--ok)}
.mapwrap{position:relative;height:clamp(300px,52vh,620px);border-radius:16px;overflow:hidden;background:var(--sea);touch-action:none}
svg#map{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.zoom{position:absolute;right:8px;top:8px;display:grid;gap:6px}
.zoom button{width:36px;height:36px;border-radius:11px;border:0;background:#fff;font-size:1.15rem;cursor:pointer;box-shadow:0 0 0 1px var(--line)}
.yrbig{position:absolute;left:10px;top:6px;font-size:2.1rem;font-weight:800;letter-spacing:-.02em;color:var(--ink);text-shadow:0 0 6px #fff,0 0 3px #fff;pointer-events:none;line-height:1}
.yrbig small{display:block;font-size:.72rem;font-weight:600;color:var(--ink2);letter-spacing:0}
.attr{position:absolute;right:8px;bottom:6px;font-size:.6rem;background:rgba(255,255,255,.8);padding:2px 7px;border-radius:6px;color:#456;pointer-events:none;max-width:78%}
.qbar{position:absolute;left:10px;right:56px;top:52px;background:rgba(255,255,255,.93);border-radius:12px;padding:6px 10px;font-size:.9rem;box-shadow:0 0 0 1px var(--line);pointer-events:none;line-height:1.25}
.qbar[hidden]{display:none}.qbar b{font-size:1rem}
.toast{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:5px 12px;border-radius:10px;font-size:.85rem;pointer-events:none;opacity:0;transition:opacity .2s;max-width:90%;text-align:center}
.toast.on{opacity:1}
.tl{background:var(--panel);border-radius:16px;padding:8px 10px 10px;border:1px solid var(--line)}
.tlbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tlbar .ib{width:34px;height:34px;border-radius:10px;border:0;background:var(--soft);cursor:pointer;font-size:1rem}
.tlbar .ib.on{background:var(--ink);color:#fff}
.yr{font-weight:800;font-size:1.05rem;min-width:70px;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-left:auto}
.chip{border:1.5px solid var(--ink2);background:none;border-radius:99px;padding:3px 10px;font-size:.78rem;cursor:pointer;color:var(--ink2)}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.track{position:relative;height:62px;margin-top:6px}
.eras{position:absolute;left:0;right:0;top:0;height:20px;display:flex;border-radius:8px;overflow:hidden}
.eras div{height:100%;display:grid;place-items:center;font-size:.64rem;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;position:absolute}
.rail{position:absolute;left:0;right:0;top:34px;height:4px;background:var(--line);border-radius:4px}
.ticks{position:absolute;left:0;right:0;top:20px;height:40px;z-index:4;pointer-events:none}
.tick{pointer-events:auto;position:absolute;top:8px;width:10px;height:18px;margin-left:-5px;border:0;background:none;padding:0;cursor:pointer}
.tick i{display:block;width:4px;height:14px;margin:2px auto 0;border-radius:3px;background:var(--c,#1f3a4d)}
.tick.act i{height:18px;margin-top:0;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--c)}
input[type=range]{position:absolute;left:-8px;right:-8px;width:calc(100% + 16px);top:22px;height:34px;margin:0;background:none;-webkit-appearance:none;appearance:none;cursor:pointer;z-index:3}
input[type=range]::-webkit-slider-runnable-track{height:34px;background:none}
input[type=range]::-moz-range-track{height:34px;background:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:6px;height:34px;border-radius:3px;background:var(--hi);box-shadow:0 0 0 2px #fff,0 0 0 3px var(--ink)}
input[type=range]::-moz-range-thumb{width:6px;height:34px;border:0;border-radius:3px;background:var(--hi);box-shadow:0 0 0 2px #fff,0 0 0 3px var(--ink)}
.scale{display:flex;justify-content:space-between;font-size:.66rem;color:var(--ink2);margin-top:-2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:8px}
.panel h2{margin:0 0 4px;font-size:1.05rem}
.es{font-weight:600}.ru{color:var(--ink2);font-size:.88rem}
.ru.off{display:none}
.era{font-size:.78rem;color:var(--ink2);margin:0 0 8px}
.legend{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 10px}
.lg{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;padding:2px 8px;border-radius:99px;background:var(--soft)}
.lg i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.evlist{display:grid;gap:4px;margin-top:8px}
.evr{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:start;padding:6px 8px;border-radius:10px;border:1px solid transparent;background:var(--soft);cursor:pointer;text-align:left;width:100%}
.evr.now{border-color:var(--hi);background:#fff7e3}
.evr.sel{border-color:var(--ink)}
.evr b{font-variant-numeric:tabular-nums;font-size:.86rem}
.card{border:1.5px solid var(--line);border-radius:14px;padding:12px;background:#fff}
.card.big{min-height:130px;display:flex;flex-direction:column;justify-content:center;gap:4px;cursor:pointer;text-align:left;width:100%}
.card .t{font-size:1.35rem;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.btn{border:0;border-radius:12px;padding:9px 15px;font-weight:600;cursor:pointer;background:var(--ink);color:#fff}
.btn.ghost{background:var(--soft);color:var(--ink)}
.fb{font-weight:700;margin:8px 0 0}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.score{color:var(--ink2);font-size:.82rem;font-variant-numeric:tabular-nums}
.chs{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.pill{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:3px 10px;font-size:.8rem;cursor:pointer}
.src{font-size:.72rem;color:var(--ink2);margin-top:8px}
.extra{font-size:.72rem;color:#8a5a00;background:#fff3d6;border-radius:6px;padding:1px 6px;margin-left:6px}
.lbl{paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;pointer-events:none;font-weight:700;fill:#25364a}
.lbl.realm{font-weight:800;fill:#22313f;stroke:rgba(255,255,255,.8);letter-spacing:.02em}
.lbl.city{font-weight:600;fill:#5a4a2a}
.pol{stroke:#fff;stroke-width:.9;vector-effect:non-scaling-stroke;fill-opacity:.5}
.pol.hl{stroke:#111;stroke-width:3;fill-opacity:.75}
.land{fill:#f3eee0;stroke:#c9bfa6;stroke-width:.6;vector-effect:non-scaling-stroke}
.evg{pointer-events:none}
.evg .m{pointer-events:auto;cursor:pointer}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
@media (max-width:999px){body[data-mode=cards] .stage{display:none}}
@media (min-width:1000px){
 .app{display:grid;grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto auto auto 1fr;column-gap:12px;padding-bottom:12px}
 header{grid-column:1/3}.modes{grid-column:1/3;max-width:760px}.parts{grid-column:1/3}
 .stage{grid-column:1;grid-row:4}.mapwrap{height:clamp(420px,calc(100vh - 290px),760px)}
 .panel{grid-column:2;grid-row:4;margin-top:0;max-height:calc(100vh - 150px);overflow:auto}
}
</style>
</head>

$('#next').onclick=()=>{stopPlay();const l=visEv().filter(e=>e.y0>S.Y+0.5);if(l.length)selectEv(l[0].id)};
function selectEv(id){stopPlay();const e=ev(id);if(S.mode!=='explore')go('explore');S.sel=id;if(e.y0<S.rmin||e.y0>S.rmax){S.rmin=370;S.rmax=1460;buildTrack()}setYear(e.snap?e.snap:e.y1);renderPanel();focusEv(e)}
function focusEv(e){const pts=[];for(const p of e.pe)pts.push(...p.pts);for(const m of e.me)pts.push(m.pt);if(!pts.length)return;const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);const r=wrap.getBoundingClientRect();const ar=r.width/r.height;let w=Math.max(x1-x0+80,160),h=Math.max(y1-y0+80,160/ar);if(w/h<ar)w=h*ar;else h=w/ar;vb={x:(x0+x1)/2-w/2,y:(y0+y1)/2-h/2,w,h};apply()}

/* ---------------- PANEL ---------------- */
const panel=$('#panel');
const ruTxt=t=>`<div class="ru ${S.ru?'':'off'}">${t}</div>`;
function renderModes(){const M=[['explore','🗺 Mapa'],['cards','🃏 Tarjetas'],['when','📅 ¿Cuándo?'],['where','📍 ¿Dónde?'],['exam','🎯 Prueba']];$('#modes').innerHTML=M.map(m=>`<button data-m="${m[0]}" aria-pressed="${S.mode===m[0]}">${m[1]}</button>`).join('')}
$('#modes').onclick=e=>{const m=e.target.dataset.m;if(m)go(m)};
$('#rusub').checked=S.ru;$('#rusub').onchange=e=>{S.ru=e.target.checked;LS.set('ru',S.ru);document.querySelectorAll('.ru').forEach(n=>n.classList.toggle('off',!S.ru))};
function go(m){stopPlay();S.mode=m;document.body.dataset.mode=m;S.sel=null;S.reveal=null;S.q=null;fx(null);gEv.style.display='';renderModes();$('#tl').style.display=(m==='cards'||m==='where'||m==='exam')?'none':'';$('#qbar').hidden=true;[S.rmin,S.rmax]=partRange();
 for(const k of Object.keys(cityEls))cityEls[k].g.style.display=(m==='where'||m==='exam')?'none':(SHOWCITY.includes(k)?'':'none');
 if(m==='explore'){buildChips();buildTrack();setYear(Math.max(S.rmin,Math.min(S.rmax,S.Y)));renderPanel()}
 else if(m==='cards'){snapOpacity();renderEvents();cardsStart()}
 else if(m==='when'){buildTrack();$('#ticks').innerHTML='';whenNext()}
 else if(m==='where'){whereNext()}
 else if(m==='exam'){examIntro()}
 fit()}
function evCard(e){const figs=(e.figs||[]).map(f=>FIG.find(x=>x.id===f)).filter(Boolean);
 return `<div class="card"><h2>${e.es}${e.extra?'<span class="extra">dato extra</span>':''}</h2>${ruTxt(e.ru)}<p class="era">${e.y0===e.y1?e.y0:e.y0+'–'+e.y1}</p><div class="es" style="font-weight:500">${e.d}</div>${ruTxt(e.dr)}${figs.length?`<div class="chs">${figs.map(f=>`<button class="pill" data-fig="${f.id}">👤 ${f.n}</button>`).join('')}</div>`:''}<div id="figbox"></div></div>`}
function renderPanel(){if(S.mode!=='explore')return;const vis=visEv();
 let h=`<p class="era" id="eraL">${eraName(S.Y)}</p><div class="legend" id="lgd">${legendHtml()}</div>`;
 if(S.sel)h+=evCard(ev(S.sel));
 h+=`<div class="evlist">${vis.map(e=>`<button class="evr${S.sel===e.id?' sel':''}" data-id="${e.id}"><b>${e.y0}${e.y1>e.y0+1?'–'+e.y1:''}</b><span><span class="es">${e.es}</span>${ruTxt(e.ru)}</span></button>`).join('')}</div><p class="src">Recorridos esquemáticos; territorios aproximados. Fuente de los hechos: resumen del Tema 1.</p>`;
 panel.innerHTML=h;markNow();$('#eraL').textContent=eraName(S.Y)}
panel.addEventListener('click',ev_=>{const r=ev_.target.closest('.evr');if(r){selectEv(r.dataset.id);return}const f=ev_.target.closest('[data-fig]');if(f){const g=FIG.find(x=>x.id===f.dataset.fig);$('#figbox').innerHTML=`<div class="card" style="margin-top:8px;background:var(--soft)"><b>${g.n}</b> <span class="score">${g.dt}</span><div class="es" style="font-weight:500">${g.es}</div>${ruTxt(g.ru)}</div>`}});
const origSetYear=setYear;
let toastT;function toast(t){const n=$('#toast');n.textContent=t;n.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>n.classList.remove('on'),1800)}
function fx(f){gFx.innerHTML='';if(!f)return;const k=1/ppu();for(const o of f){if(o.t==='ring'){el('circle',{cx:o.p[0],cy:o.p[1],r:16*k,fill:'none',stroke:o.c,'stroke-width':3.2*k},gFx)}else if(o.t==='dot'){el('circle',{cx:o.p[0],cy:o.p[1],r:5*k,fill:o.c,stroke:'#fff','stroke-width':1.5*k},gFx)}else if(o.t==='line'){el('line',{x1:o.a[0],y1:o.a[1],x2:o.b[0],y2:o.b[1],stroke:o.c,'stroke-width':1.8*k,'stroke-dasharray':`${5*k} ${4*k}`},gFx)}else if(o.t==='lab'){const t=el('text',{x:o.p[0],y:o.p[1]-12*k,class:'lbl','text-anchor':'middle','font-size':12*k,style:`stroke-width:${3*k}px`},gFx);t.textContent=o.s}}}

/* ---------------- CARDS ---------------- */
let C={deck:'fig',q:[],cur:null,flip:false,rev:false,seen:new Set(),n:0,ok:0,round:1};
function deckList(){const l=(C.deck==='fig'?FIG:TERM).filter(inPart);return l.length?l:(C.deck==='fig'?FIG:TERM)}
function cardsStart(){C.q=[];C.seen=new Set();C.round=1;cardNext(true)}
function cardNext(first){const list=deckList();if(!C.q.length){const ids=list.map(c=>c.id);for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}ids.sort((a,b)=>Math.min(box[a]||0,3)-Math.min(box[b]||0,3));C.q=ids;if(!first){C.round++;C.seen=new Set()}}
 const nid=C.q.shift();C.cur=list.find(c=>c.id===nid);C.seen.add(C.cur.id);C.flip=false;renderCard()}
function renderCard(){const c=C.cur,list=deckList();const front=C.rev?`<div class="es" style="font-weight:500">${c.es}</div>${ruTxt(c.ru)}`:`<div class="t">${c.n}</div>${c.dt?`<div class="score">${c.dt}</div>`:''}`;
 const back=C.rev?`<div class="t">${c.n}</div>${c.dt?`<div class="score">${c.dt}</div>`:''}`:`<div class="es" style="font-weight:500">${c.es}</div>${ruTxt(c.ru)}`;
 const evs=(c.ev||[]).map(id=>ev(id)).filter(Boolean);
 panel.innerHTML=`<div class="chips" style="margin:0 0 8px"><button class="chip" data-deck="fig" aria-pressed="${C.deck==='fig'}">Personajes</button><button class="chip" data-deck="term" aria-pressed="${C.deck==='term'}">Conceptos</button><button class="chip" data-rev="1" aria-pressed="${C.rev}">Datos → nombre</button></div>
 <p class="score">Ronda ${C.round}: ${C.seen.size} / ${list.length} · ${C.ok} / ${C.n}</p>
 <button class="card big" id="cd">${C.flip?back:front}${C.flip?'':`<span class="score">${C.rev?'¿Quién o qué es?':'¿Qué sabes de…?'} (tap)</span>`}</button>
 ${C.flip?`<div class="row"><button class="btn" id="kn">✓ Lo sabía</button><button class="btn ghost" id="nk">✗ No lo sabía</button></div>${evs.length?`<div class="chs">${evs.map(e=>`<button class="pill" data-ev="${e.id}">🗺 ${e.es}</button>`).join('')}</div>`:''}`:''}`;
 $('#cd').onclick=()=>{if(!C.flip){C.flip=true;renderCard()}};
 if(C.flip){$('#kn').onclick=()=>{C.n++;C.ok++;box[c.id]=Math.min(5,(box[c.id]||0)+1);LS.set('box',box);cardNext()};$('#nk').onclick=()=>{C.n++;box[c.id]=Math.max(0,(box[c.id]||0)-2);LS.set('box',box);C.q.splice(Math.min(3,C.q.length),0,c.id);cardNext()}}}
panel.addEventListener('click',e=>{if(S.mode!=='cards')return;const d=e.target.dataset.deck;if(d){C.deck=d;cardsStart()}if(e.target.dataset.rev){C.rev=!C.rev;renderCard()}const v=e.target.closest('[data-ev]');if(v)selectEv(v.dataset.ev)});

/* ---------------- QUIZ: WHEN ---------------- */
let Q={n:0,ok:0};
function whenNext(){const pool=EV.filter(e=>e.q&&inPart(e));let e;do{e=pool[Math.floor(Math.random()*pool.length)]}while(S.q&&S.q.e===e&&pool.length>1);whenAsk(e)}
function whenAsk(e){S.reveal=null;S.q={t:'when',e};$('#tl').style.display='';$('#ticks').innerHTML='';S.Y=Math.round(S.rmin+(S.rmax-S.rmin)/2);setYear(S.Y);fx(null);gEv.style.display='none';
 $('#qbar').hidden=false;$('#qbar').innerHTML=`📅 <b>${e.es}</b>${S.ru?`<div class="score">${e.ru}</div>`:''}`;
 panel.innerHTML=`${scoreHead()}<div class="card"><div class="t" style="font-size:1.25rem;font-weight:800">${e.es}</div>${ruTxt(e.ru)}<p class="era" style="margin-top:8px">Mueve la línea del tiempo al año y pulsa «Comprobar»</p></div><div class="row"><button class="btn" id="chk">Comprobar</button></div><div id="res"></div>`;
 $('#chk').onclick=whenCheck}
function whenCheck(){const e=S.q.e,y=S.Y,t=e.qd,d=Math.abs(y-t);const ok=d<=(t>700?5:10);record(ok,'📅 '+e.es+' — '+t);const cls=d<=2?'ok':ok?'ok':'bad';
 gEv.style.display='';S.reveal=e.id;setYear(t);const msg=d===0?'¡Exacto!':d<=2?`Casi exacto: ${t}`:ok?`¡Bien! Fue en el ${t} (diferencia: ${d})`:`Fue en el ${t} (te has equivocado por ${d} años)`;
 $('#res').innerHTML=`<p class="fb ${cls}">${msg}</p><div class="es" style="font-weight:500;margin-top:4px">${e.d}</div>${ruTxt(e.dr)}<div class="row"><button class="btn" id="nx">Siguiente</button></div>`;$('#chk').disabled=true;$('#nx').onclick=S.mode==='exam'?examNext:whenNext;focusEv(e)}

/* ---------------- QUIZ: WHERE ---------------- */
function wherePool(){const pl=S.part==='all'?PLACES:PLACESP[S.part];const rq=(S.part==='all'?REALMQ:REALMP[S.part]).filter(([y,k])=>H.snaps[y]&&H.snaps[y].some(i=>i.k===k));return{pl,rq}}
function mkWhere(){const {pl,rq}=wherePool();if(Math.random()<.5||!rq.length){return{t:'place',id:pl[Math.floor(Math.random()*pl.length)]}}const [y,k]=rq[Math.floor(Math.random()*rq.length)];const it=H.snaps[y].find(i=>i.k===k);return{t:'realm',y,k,es:it.es,ru:it.ru}}
function whereNext(){let q;do{q=mkWhere()}while(S.q&&JSON.stringify(q)===JSON.stringify(S.q));whereAsk(q)}
function whereAsk(q){S.reveal=null;gEv.style.display='none';fx(null);$('#tl').style.display='none';
 S.q=q;S.done=false;if(q.t==='realm')S.Y=q.y;else S.Y=S.Y<375?395:S.Y;setYear(S.Y);fit();
 const prompt=q.t==='place'?`<div class="t" style="font-size:1.25rem;font-weight:800">${CITY[q.id][0]}</div><div class="ru ${S.ru?'':'off'}">${CITY[q.id][1]}</div>`:`<div class="es">En el año ${q.y}:</div><div class="t" style="font-size:1.25rem;font-weight:800">${q.es}</div><div class="ru ${S.ru?'':'off'}">${q.y}: ${q.ru}</div>`;
 $('#qbar').hidden=false;$('#qbar').innerHTML=q.t==='place'?`📍 <b>${CITY[q.id][0]}</b>${S.ru?`<div class="score">${CITY[q.id][1]}</div>`:''}`:`📍 Año ${q.y}: <b>${q.es}</b>${S.ru?`<div class="score">${q.y} г.: ${q.ru}</div>`:''}`;
 panel.innerHTML=`${scoreHead()}<div class="card">${prompt}<p class="era" style="margin-top:8px">Toca el lugar en el mapa</p></div><div id="res"></div>`}
function onTap(x,y,target){
 if((S.mode==='where'||S.mode==='exam')&&S.q&&(S.q.t==='place'||S.q.t==='realm')&&!S.done){const q=S.q;S.done=true;let ok=false;
  if(q.t==='place'){const pt=prj(...CITY[q.id][2]);const d=Math.hypot(pt[0]-x,pt[1]-y);ok=d<28;cityEls[q.id].g.style.display='';fx([{t:'dot',p:pt,c:ok?'#2f8f5b':'#c0392b'},{t:'ring',p:pt,c:ok?'#2f8f5b':'#c0392b'},{t:'lab',p:pt,s:CITY[q.id][0]}].concat(ok?[]:[{t:'dot',p:[x,y],c:'#d1432f'},{t:'line',a:[x,y],b:pt,c:'#d1432f'}]))}
  else{const grp=SN[q.y];const pt=svg.createSVGPoint();pt.x=x;pt.y=y;const hit=grp.pols.filter(o=>o.it.k===q.k);ok=hit.some(o=>{try{return o.p.isPointInFill(pt)}catch(e){return false}});hit.forEach(o=>o.p.classList.add('hl'));setTimeout(()=>hit.forEach(o=>o.p.classList.remove('hl')),6000);
   grp.lg.style.display='';fx(ok?null:[{t:'dot',p:[x,y],c:'#d1432f'}])}
  record(ok,'📍 '+(q.t==='place'?CITY[q.id][0]:q.y+': '+q.es));
  $('#res').innerHTML=`<p class="fb ${ok?'ok':'bad'}">${ok?'¡Correcto!':'No es ahí. Mira el lugar correcto en el mapa.'}</p>${q.t==='place'?`<div class="es" style="font-weight:500">${PLACENOTE[q.id]}</div>`:''}<div class="row"><button class="btn" id="nx">Siguiente</button></div>`;$('#nx').onclick=S.mode==='exam'?examNext:whereNext;return}
 if(S.mode==='explore'){const m=target&&target.closest&&target.closest('.m');if(m){selectEv(m.dataset.ev);return}const p=target&&target.closest&&target.closest('.pol');if(p)toast(p.dataset.es+' · '+p.dataset.ru)}}

/* ---------------- WHO + EXAM ---------------- */
function scoreHead(){if(S.mode==='exam'&&S.exam){const E=S.exam;return`<p class="score">Prueba ${partName()}: ${Math.min(E.i+1,E.items.length)} / ${E.items.length} · ✓ ${E.ok}</p><div class="bar"><i style="width:${E.i/E.items.length*100}%"></i></div>`}return`<p class="score">${Q.ok} / ${Q.n}</p>`}
function record(ok,label){if(S.mode==='exam'&&S.exam){if(ok)S.exam.ok++;else S.exam.wrong.push(label)}else{Q.n++;if(ok)Q.ok++}}
const partName=()=>PARTS.find(p=>p[0]===S.part)[1];
function whoAsk(it){S.q={t:'who'};S.reveal=null;$('#qbar').hidden=true;$('#tl').style.display='none';const pool=(it.deck==='fig'?FIG:TERM);const same=pool.filter(x=>x.id!==it.c.id&&inPart(x));const others=pool.filter(x=>x.id!==it.c.id&&!inPart(x));
 const wrong=[...same.sort(()=>Math.random()-.5),...others.sort(()=>Math.random()-.5)].slice(0,3);const opts=[it.c,...wrong].sort(()=>Math.random()-.5);
 panel.innerHTML=`${scoreHead()}<div class="card"><p class="era">${it.deck==='fig'?'¿Quién es?':'¿Qué concepto es?'}</p><div class="es" style="font-weight:500">${it.c.es}</div>${ruTxt(it.c.ru)}<div class="opts">${opts.map(o=>`<button class="opt" data-o="${o.id}">${o.n}</button>`).join('')}</div></div><div id="res"></div>`;
 panel.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(S.q.done)return;S.q.done=true;const ok=b.dataset.o===it.c.id;b.classList.add(ok?'ok':'bad');panel.querySelector(`[data-o="${it.c.id}"]`).classList.add('ok');record(ok,'👤 '+it.c.n);
  $('#res').innerHTML=`<p class="fb ${ok?'ok':'bad'}">${ok?'¡Correcto!':'Respuesta: '+it.c.n}</p><div class="row"><button class="btn" id="nx">Siguiente</button></div>`;$('#nx').onclick=S.mode==='exam'?examNext:()=>whoAsk(randWho())})}
function randWho(){const d=Math.random()<.5?'fig':'term';const l=(d==='fig'?FIG:TERM).filter(inPart);return{deck:d,c:l[Math.floor(Math.random()*l.length)]}}
function examIntro(){const best=LS.get('best_'+S.part,null);$('#tl').style.display='none';gEv.style.display='none';
 panel.innerHTML=`<div class="card"><h2>🎯 Prueba: ${partName()}</h2><p class="era">${S.part==='all'?'Todo el tema 1':'Fecha prevista: '+PARTS.find(p=>p[0]===S.part)[2]}</p><div class="es" style="font-weight:500">12 preguntas mezcladas: quién es quién y conceptos, fechas en la línea del tiempo, lugares y territorios en el mapa.</div>${ruTxt('12 вопросов вперемешку: кто есть кто и понятия, даты на линии времени, места и территории на карте.')}${best!=null?`<p class="score" style="margin-top:8px">Mejor nota: ${best} / 10</p>`:''}<div class="row"><button class="btn" id="go">Empezar</button></div></div>`;$('#go').onclick=examStart}
function examStart(){const items=[];const evs=EV.filter(e=>e.q&&inPart(e)).sort(()=>Math.random()-.5);const figs=FIG.filter(inPart).sort(()=>Math.random()-.5),terms=TERM.filter(inPart).sort(()=>Math.random()-.5);
 for(let i=0;i<3&&i<evs.length;i++)items.push({t:'when',e:evs[i]});
 const seenW=new Set();for(let i=0;items.filter(x=>x.t==='where').length<4&&i<40;i++){const q=mkWhere();const k=JSON.stringify(q);if(!seenW.has(k)){seenW.add(k);items.push({t:'where',q})}}
 for(const c of figs.slice(0,3))items.push({t:'who',deck:'fig',c});for(const c of terms.slice(0,12-items.length))items.push({t:'who',deck:'term',c});
 items.sort(()=>Math.random()-.5);S.exam={items:items.slice(0,12),i:-1,ok:0,wrong:[]};examNext()}
function examNext(){const E=S.exam;E.i++;fx(null);gEv.style.display='none';S.reveal=null;S.done=false;if(E.i>=E.items.length)return examEnd();const it=E.items[E.i];
 [S.rmin,S.rmax]=partRange();if(it.t==='when'){buildTrack();whenAsk(it.e)}else if(it.t==='where')whereAsk(it.q);else whoAsk(it)}
function examEnd(){const E=S.exam;const n=E.items.length,g=Math.round(E.ok/n*100)/10;const nota=Math.round(E.ok/n*10*10)/10;const best=LS.get('best_'+S.part,0);if(nota>best)LS.set('best_'+S.part,nota);$('#qbar').hidden=true;
 panel.innerHTML=`<div class="card"><h2>Resultado</h2><div class="t">${nota} / 10</div><p class="score">${E.ok} de ${n} correctas</p>${E.wrong.length?`<p class="era" style="margin-top:8px">Repasa:</p><div class="evlist">${E.wrong.map(w=>`<div class="evr" style="cursor:default">${w}</div>`).join('')}</div>`:'<p class="fb ok">¡Sin errores!</p>'}<div class="row"><button class="btn" id="again">Otra prueba</button><button class="btn ghost" id="study">🃏 Tarjetas</button></div></div>`;
 $('#again').onclick=examStart;$('#study').onclick=()=>go('cards')}

/* ---------------- INIT ---------------- */
renderModes();buildChips();[S.rmin,S.rmax]=partRange();buildTrack();setYear(Math.max(S.rmin,395));renderPanel();requestAnimationFrame(fit);
</script>
