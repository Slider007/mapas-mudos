<!doctype html>
<html lang="ru" data-theme="light" style="color-scheme:light">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa mudo de España — контурная карта Испании</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🗺️%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--sea:#cfe1e8;--sea2:#bcd5df;--land:#fffefb;--other:#e4e2dc;--ink:#1f3a4d;--ink2:#5b7282;--line:#2c4c63;
--bg:#f6f8f9;--panel:#ffffff;--soft:#eef2f4;--hi:#f2a516;--ok:#2f8f5b;--bad:#d1432f;--onhi:#1f2a33;color-scheme:light}


html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.app{display:grid;height:100%;grid-template-rows:auto auto 1fr auto;max-width:1400px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px 6px}
h1{order:3;flex:0 0 100%;margin:0;font-size:1.35rem;font-weight:800;letter-spacing:-.01em;font-variation-settings:"opsz" 48}
h1 small{display:block;font-size:.8rem;font-weight:400;color:var(--ink2);letter-spacing:0}
.home{order:1;flex:none;color:var(--ink2);text-decoration:none;font-size:.85rem;font-weight:600;border:1.5px solid var(--ink2);border-radius:99px;padding:3px 10px}.home:hover,.home:focus-visible{color:var(--ink);border-color:var(--ink)}
.lang{order:2;margin-left:auto;display:flex;border:1.5px solid var(--ink2);border-radius:99px;overflow:hidden;flex:none}
.lang button{border:0;background:none;padding:3px 10px;font-size:.8rem;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.controls{padding:0 16px 8px;display:grid;gap:8px;min-width:0}
.secs{display:flex;gap:6px}
.btn.dl{padding:7px 12px;font-size:.85rem}
.attr{position:absolute;right:8px;bottom:6px;font-size:.62rem;background:rgba(255,255,255,.78);padding:2px 7px;border-radius:6px;color:#456;pointer-events:none;max-width:70%}
.dlrow{display:grid;gap:6px;justify-items:start}
.dlopts{display:grid;gap:6px;justify-items:start}
.dlopts[hidden]{display:none}
.dlnote{font-size:.7rem;color:var(--ink2);margin:0}
.secs button{flex:1;min-width:0;border:1.5px solid var(--ink);background:none;border-radius:12px;padding:7px 4px;font-weight:700;cursor:pointer;font-size:.9rem}
.secs button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.modes{display:flex;flex-wrap:wrap;gap:4px;background:var(--soft);padding:4px;border-radius:14px}
.modes button{flex:1 1 auto;border:0;background:none;padding:8px 2px;border-radius:10px;font-size:.82rem;font-weight:600;cursor:pointer;white-space:nowrap}
.modes button[aria-pressed=true]{background:var(--panel);box-shadow:0 1px 0 var(--sea2),0 0 0 1px var(--sea2)}
.cats{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:2px}
.cats::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--ink2);background:none;border-radius:99px;padding:4px 11px;font-size:.82rem;cursor:pointer;color:var(--ink2)}
.card{width:100%;min-height:96px;margin-top:8px;border:1.5px solid var(--sea2);border-radius:16px;background:var(--panel);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;padding:12px}
.cq{font-size:2.4rem;font-weight:800;color:var(--ink2);line-height:1}
.hint{font-size:.88rem;margin:6px 0 0;padding:6px 10px;border-radius:10px;background:color-mix(in srgb,var(--hi) 18%,var(--panel));color:var(--ink)}
.cgrp{flex-basis:100%;text-align:left;border:0;background:none;padding:6px 2px 0;font-size:.74rem;font-weight:700;color:var(--ink2);cursor:pointer}
.cgrp:first-child{padding-top:0}
.chip[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.mapwrap{position:relative;min-height:min(62vh,560px);margin:0 8px;border-radius:18px;overflow:hidden;background:var(--sea);touch-action:none}
svg#map{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none;cursor:crosshair}
.zoom{position:absolute;right:10px;top:10px;display:grid;gap:6px}
.zoom button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.othershade{fill:var(--other);fill-opacity:.55;stroke:none}
#phys .othershade{fill-opacity:.38}
.esline{fill:none;stroke:var(--line);stroke-width:1.3;vector-effect:non-scaling-stroke;stroke-linejoin:round}
svg.physon .zone{fill-opacity:.08}
#grat line{stroke:var(--ink2);stroke-opacity:.18;stroke-width:.6;vector-effect:non-scaling-stroke}
#grat text{fill:var(--ink2);fill-opacity:.55;font-size:11px;font-weight:600}
svg.examstyle #grat line{stroke-opacity:.35}
.riv.ctx{stroke:#5d7f96;stroke-width:1.3;stroke-opacity:1}.riv.ctx.main{stroke-width:2}
svg.examstyle .es{fill:#f4f4f2}
.zoom button{width:38px;height:38px;border-radius:12px;border:0;background:var(--panel);color:var(--ink);font-size:1.2rem;cursor:pointer;box-shadow:0 0 0 1px var(--sea2)}
.panel{padding:12px 16px 14px;min-height:118px}
.prompt{font-size:.82rem;color:var(--ink2);margin:0 0 2px}
.target{font-size:1.6rem;font-weight:800;letter-spacing:-.015em;margin:0;line-height:1.15}
.sub{color:var(--ink2);font-size:.9rem;margin:2px 0 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--ink);color:var(--bg)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opts button{border:1.5px solid var(--sea2);background:var(--panel);border-radius:12px;padding:10px 8px;cursor:pointer;font-weight:600;text-align:left}
.opts button.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--panel))}
.opts button.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--panel))}
input.ans{flex:1;min-width:0;font:inherit;font-size:1.1rem;padding:10px 12px;border-radius:12px;border:1.5px solid var(--sea2);background:var(--panel);color:var(--ink)}
.fb{font-weight:700;margin:8px 0 0}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.score{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:.85rem}
.bar{height:8px;border-radius:9px;background:var(--soft);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:9px}
.prog{display:grid;gap:10px;margin-top:8px}
.prog .h{display:flex;justify-content:space-between;font-size:.9rem}
.src{font-size:.75rem;color:var(--ink2);margin:6px 0 0;line-height:1.35}
.weak{font-size:.85rem;color:var(--ink2)}
.toggle{display:flex;gap:6px;align-items:center;font-size:.85rem;color:var(--ink2);cursor:pointer}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
/* map styles */
.sea{fill:var(--sea)}
.other{fill:var(--other);stroke:var(--sea2);stroke-width:.6}
.es,.isl,.other,.inset{vector-effect:non-scaling-stroke}
.es{fill:var(--land);stroke:var(--line);stroke-width:1.5;stroke-linejoin:round}
.isl{fill:var(--land);stroke:var(--line);stroke-width:.9}
.isl.hi{fill:var(--hi)}
.isl.ok{fill:var(--ok)}
.inset{fill:none;stroke:var(--ink2);stroke-width:1.2;stroke-dasharray:5 4}
.insetbg{fill:var(--sea)}
.pt{fill:var(--line);stroke:var(--land);stroke-width:1.2}
.area-mark{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:3 3;opacity:.5}
.lbl{fill:var(--line);paint-order:stroke;stroke:var(--sea);stroke-width:3px;stroke-linejoin:round;font-weight:600;pointer-events:none}
.lbl.big{font-style:italic;font-weight:400;fill:var(--ink2);letter-spacing:.06em}
.riv{fill:none;stroke:#3d86b8;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.riv.main{stroke-width:2.6}.riv.dim{stroke-opacity:.35}
.rivhi{fill:none;stroke:var(--hi);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;stroke-opacity:.9}
.rivhi.ok{stroke:var(--ok)}
.flash{pointer-events:none;vector-effect:non-scaling-stroke;animation:blink .38s ease-in-out 4}
.fl-line{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;stroke-opacity:.95}
.fl-zone{stroke-width:3;fill-opacity:.4}
.fl-pt{fill:none;stroke-width:4}
.flash.sel{stroke:#7b5cff}.fl-zone.sel{fill:#7b5cff}
.flash.ok{stroke:var(--ok)}.fl-zone.ok{fill:var(--ok)}
.flash.bad{stroke:var(--bad)}.fl-zone.bad{fill:var(--bad)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.1}}
@media (prefers-reduced-motion:reduce){.flash{animation:none;opacity:.85}}
.zone{fill:#b08a5a;fill-opacity:.18;stroke:#8a6a40;stroke-opacity:.5;stroke-width:1;stroke-dasharray:4 3;vector-effect:non-scaling-stroke}
.zone.sea{fill:#3d86b8;fill-opacity:.14;stroke:#2c6f9c;stroke-opacity:.6}
.zonehi{fill:var(--hi);fill-opacity:.45;stroke:var(--hi);stroke-width:2;vector-effect:non-scaling-stroke}.zonehi.ok{fill:var(--ok);stroke:var(--ok)}
.peak{fill:#7a5530;stroke:var(--land);stroke-width:1;vector-effect:non-scaling-stroke}
.lbl.rlbl{fill:#2a6f9e;font-style:italic}
.lbl.rv{font-weight:600;letter-spacing:.02em}
.ridge{fill:none;stroke:#8a5a2b;stroke-width:3;stroke-opacity:.75;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 4;vector-effect:non-scaling-stroke}
.ridge.sys{stroke-width:5;stroke-opacity:.45}
.area-big{fill:#b08a5a;fill-opacity:.10;stroke:#8a6a40;stroke-opacity:.55;stroke-width:1;stroke-dasharray:4 3;vector-effect:non-scaling-stroke}
.area-big.sys{fill-opacity:.06}
.ridgehi{fill:none;stroke:var(--hi);stroke-width:8;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;stroke-opacity:.9}.ridgehi.ok{stroke:var(--ok)}
.lbl.sysl{fill:#1d1d1b;font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:700;font-style:normal;stroke:rgba(255,255,255,.8);fill-opacity:.92}

.area-big.sys,.ridge.sys{display:none}
svg.physon .zone:not(.sea){fill:none;stroke:none}
.ring{fill:none;stroke:var(--hi);stroke-width:3}
.ring.ok{stroke:var(--ok)}
.tap{fill:var(--bad)}
.tapline{stroke:var(--bad);stroke-width:1.5;stroke-dasharray:4 3}
@media (prefers-reduced-motion:no-preference){.ring.pulse{animation:pulse 1.4s ease-out infinite}}
@keyframes pulse{0%{stroke-opacity:1}100%{stroke-opacity:.25}}
@media (min-width:900px){
 .app{grid-template-columns:380px 1fr;grid-template-rows:auto auto 1fr;column-gap:8px}
 header{grid-column:1}.controls{grid-column:1}.panel{grid-column:1;grid-row:3}
 .mapwrap{grid-column:2;grid-row:1/4;margin:12px 12px 12px 0;min-height:0}
 .target{font-size:2rem}
}
</style>

 $('#modes').innerHTML=modes.map(m=>`<button data-m="${m}" aria-pressed="${S.mode===m}">${t('modes')[['study','find','what','exam','prog','trib','cards','chain'].indexOf(m)]}</button>`).join('');
 {let pg=null;$('#cats').innerHTML=CATS.filter(c=>c.sec===S.sec).map(c=>{let hd='';if(c.g&&c.g!==pg){pg=c.g;hd=`<button class="cgrp" data-g="${c.g}" title="${S.lang==='es'?'Solo este grupo / todos':'Только эта группа / все'}">${GRP[c.g][S.lang]} ›</button>`}
 return hd+`<button class="chip" data-c="${c.id}" aria-pressed="${S.cats.includes(c.id)}">${c[S.lang]}</button>`}).join('')}}
document.querySelector('.lang').onclick=e=>{const l=e.target.dataset.l;if(l){S.lang=l;LS.set('lang',l);renderChrome();go(S.mode)}};
$('#modes').onclick=e=>{const m=e.target.dataset.m;if(m)go(m)};
$('#secs').onclick=e=>{const x=e.target.dataset.s;if(!x||x===S.sec)return;S.sec=x;LS.set('sec',x);cur=null;if(S.mode==='trib'&&x!=='rios')S.mode='study';go(S.mode)};
$('#cats').onclick=e=>{const g=e.target.dataset.g;if(g){const ids=CATS.filter(c=>c.g===g).map(c=>c.id);const relAll=CATS.filter(c=>c.sec==='rel').map(c=>c.id);const cur=S.cats.filter(x=>relAll.includes(x));
  const only=cur.length===ids.length&&ids.every(i=>cur.includes(i));
  S.cats=[...S.cats.filter(x=>!relAll.includes(x)),...(only?relAll:ids)];LS.set('cats3',S.cats);renderChrome();go(S.mode);return}
 const c=e.target.dataset.c;if(!c)return;S.cats=S.cats.includes(c)?S.cats.filter(x=>x!==c):[...S.cats,c];LS.set('cats3',S.cats);renderChrome();go(S.mode)};

let tapHandler=null,cur=null,exam=null;
function onTap(x,y){tapHandler&&tapHandler(x,y)}
function updPhys(){const b=$('#zphys');const ex=S.mode==='exam';let m=S.bgs[S.sec]||'gray';if(ex&&m==='ign')m='gray';if(ex&&m==='color')m='gray';b.style.display='';
 PH.style.display=m==='color'?'':'none';PHI.style.display=m==='ign'?'':'none';PHG.style.display=m==='gray'?'':'none';
 svg.classList.toggle('physon',m!=='none');svg.classList.toggle('examstyle',ex);b.setAttribute('aria-pressed',m!=='none');
 b.title=S.lang==='es'?{gray:'Relieve gris',color:'Mapa físico en color',ign:'Mapa físico IGN 2025',none:'Sin relieve'}[m]:{gray:'Серый рельеф',color:'Цветная физическая карта',ign:'Физическая карта IGN 2025',none:'Без рельефа'}[m];b.textContent=m==='color'?'🎨':m==='ign'?'🇪🇸':'⛰'}
function go(m){if(m!==S.mode)streak={n:0,ok:0};S.mode=m;clearFx();tapHandler=null;exam=m==='exam'?exam:null;renderChrome();drawMarks();updPhys();
 if(!active().length&&m!=='prog'){h(`<p class="sub">${t('none')}</p>`);return}
 ({study,find,what,exam:examIntro,prog,trib,cards,chain,weak:()=>{if(!curPool().length){h(`<p class="sub">${t('noweak')}</p>`);return}find()}})[m]()}

function study(){h(`<p class="prompt">${t('study')}</p><div class="row"><label class="toggle"><input type="checkbox" id="lb" ${S.labels?'checked':''}> ${t('labels')}</label></div>`);
 $('#lb').onchange=e=>{S.labels=e.target.checked;drawMarks()};
 tapHandler=(x,y)=>{const[o,d]=nearest(x,y,active());if(!o||d>u(40))return;clearFx();highlight(o,'ok');flash(o,'sel');
  h(`<p class="prompt">${(()=>{const c=CATS.find(c=>c.id===o.cat);return c.g&&c.g!=='mes'?GRP[c.g][S.lang]+' → '+c[S.lang]:c[S.lang]})()}</p><p class="target">${o.name}</p><p class="sub">${o.ru}${o.parent?`<br>${t('tribof')} ${BY[o.parent].name}${o.bank?', '+t(o.bank==='D'?'der':'izq'):''}${o.recv?` (${t('via')} ${BY[o.recv].name})`:''}`:''}</p>${hintHtml(o)}<p class="src">${t('srcl')}: ${SRC[o.id]||''}</p>
  <div class="row"><button class="btn ghost" id="say">🔊 ${t('say')}</button><label class="toggle"><input type="checkbox" id="lb" ${S.labels?'checked':''}> ${t('labels')}</label></div>`);
  $('#say').onclick=()=>speak(o.name);$('#lb').onchange=e=>{S.labels=e.target.checked;drawMarks();highlight(o,'ok')};speak(o.name)}}

let streak={n:0,ok:0};
function scoreLine(){return `<span class="score">${streak.ok} / ${streak.n}</span> ${deckLine()}`}
function curPool(){return S.mode==='weak'?active().filter(o=>box[o.id]!==undefined&&(box[o.id]||0)<2):active()}
function find(){clearFx();const pool=curPool();if(!pool.length){h(`<p class="sub">${t('noweak')}</p>`);return}cur=pick(pool,cur&&cur.id);let done=false;
 h(`<p class="prompt">${t('find')} ${scoreLine()}</p><p class="target">${cur.name}</p><div id="fb"></div>`);
 tapHandler=(x,y)=>{if(done)return;done=true;const[o,d]=nearest(x,y,O.filter(inSec));const dt=dist(cur,x,y);if(o&&dist(o,x,y)<u(40))flash(o,o===cur?'ok':'bad');
  const ok=(o===cur&&dt<u(140))||dt<6||own(cur,x,y);streak.n++;if(ok)streak.ok++;grade(cur,ok);highlight(cur,'ok');tagName(cur);
  if(!ok)markTap(x,y,cur);
  $('#fb').innerHTML=ok?`<p class="fb ok">${t('ok')}</p>`:`<p class="fb bad">${o&&dist(o,x,y)<u(30)&&o!==cur?t('bad')+o.name:t('far')}</p>${hintHtml(cur)}<div class="row"><button class="btn" id="nx">${t('next')}</button></div>`;
  panel.querySelector('.score').textContent=`${streak.ok} / ${streak.n}`;
  if(ok)setTimeout(()=>(S.mode==='find'||S.mode==='weak')&&find(),1100);else $('#nx').onclick=find}}

function what(){clearFx();const pool=active();cur=pick(pool,cur&&cur.id);highlight(cur);let done=false;
 const tog=`<label class="toggle"><input type="checkbox" id="ty" ${S.typing?'checked':''}> ${t('type')}</label>`;
 if(S.typing){h(`<p class="prompt">${t('what')} ${scoreLine()}</p><div class="row"><input class="ans" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" lang="es" placeholder="${t('ans')}"><button class="btn" id="ck">${t('check')}</button></div><div id="fb"></div><div class="row">${tog}</div>`);
  const sub=()=>{if(done){what();return}const r=checkText(cur,$('#ans').value);if(r==='empty')return;
   if(r==='almost'){$('#fb').innerHTML=`<p class="fb bad">${t('almost')}${cur.name}</p>`;return}
   done=true;const ok=r==='ok';streak.n++;if(ok)streak.ok++;grade(cur,ok);clearFx();highlight(cur,'ok');tagName(cur);
   $('#fb').innerHTML=`<p class="fb ${ok?'ok':'bad'}">${ok?t('ok'):t('ans')+': '+cur.name}</p>`;$('#ck').textContent=t('next');
   panel.querySelector('.score').textContent=`${streak.ok} / ${streak.n}`;speak(cur.name);if(ok)setTimeout(()=>S.mode==='what'&&done&&what(),1200)};
  $('#ck').onclick=sub;$('#ans').onkeydown=e=>{if(e.key==='Enter')sub()};setTimeout(()=>$('#ans')&&$('#ans').focus({preventScroll:true}),50)}
 else{let same=O.filter(o=>o.cat===cur.cat&&o!==cur);if(same.length<3)same=same.concat(O.filter(o=>o.cat!==cur.cat&&o.kind===cur.kind&&o!==cur));
  const opts=[cur,...same.sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);
  h(`<p class="prompt">${t('what')} ${scoreLine()}</p><div class="opts">${opts.map(o=>`<button data-id="${o.id}">${o.name}</button>`).join('')}</div><div class="row">${tog}</div>`);
  panel.querySelector('.opts').onclick=e=>{const id=e.target.dataset.id;if(!id||done)return;done=true;const ok=id===cur.id;streak.n++;if(ok)streak.ok++;grade(cur,ok);
   panel.querySelectorAll('.opts button').forEach(b=>{if(b.dataset.id===cur.id)b.classList.add('ok');else if(b.dataset.id===id)b.classList.add('bad')});
   clearFx();highlight(cur,'ok');speak(cur.name);panel.querySelector('.score').textContent=`${streak.ok} / ${streak.n}`;setTimeout(()=>S.mode==='what'&&what(),ok?900:2000)}}
 $('#ty').onchange=e=>{S.typing=e.target.checked;LS.set('typing',S.typing);what()}}

function trib(){clearFx();const pool=active().filter(o=>o.parent&&o.bank);if(!pool.length){h(`<p class="sub">${t('notrib')}</p>`);return}
 cur=pick(pool,cur&&cur.id);highlight(cur);let done=false;
 const lab=(p,sd)=>`${BY[p].short}, ${t(sd==='D'?'der':'izq')}`;
 const parents=[...new Set(O.filter(o=>o.parent&&o.bank).map(o=>o.parent))].filter(p=>p!==cur.parent).sort(()=>Math.random()-.5);
 const opts=[[cur.parent,cur.bank],[cur.parent,cur.bank==='D'?'I':'D'],...parents.slice(0,2).map(p=>[p,Math.random()<.5?'D':'I'])].sort(()=>Math.random()-.5);
 h(`<p class="prompt">${t('tribq')} ${scoreLine()}</p><p class="target">${cur.name}</p><div class="opts">${opts.map(([p,sd])=>`<button data-k="${p}|${sd}">${lab(p,sd)}</button>`).join('')}</div>`);
 panel.querySelector('.opts').onclick=e=>{const k=e.target.dataset.k;if(!k||done)return;done=true;const ok=k===cur.parent+'|'+cur.bank;streak.n++;if(ok)streak.ok++;grade(cur,ok);
  panel.querySelectorAll('.opts button').forEach(b=>{if(b.dataset.k===cur.parent+'|'+cur.bank)b.classList.add('ok');else if(b.dataset.k===k)b.classList.add('bad')});
  clearFx();highlight(BY[cur.parent],'pulse');highlight(cur,'ok');panel.querySelector('.score').textContent=`${streak.ok} / ${streak.n}`;setTimeout(()=>S.mode==='trib'&&trib(),ok?1100:2400)}}

const SEQ={"costa": ["vizc", "machi", "ajo", "cant", "penas", "bares", "orte", "prior", "touri", "finis", "atl", "cadiz", "tarifa", "gibr", "med", "alme", "gata", "mazar", "palos", "alic", "nao", "valen", "jorge", "roses", "creus", "leon", "mallorca", "menorca", "ibiza", "formentera", "cabrera", "lanzarote", "fuerteventura", "gran_canaria", "tenerife", "la_gomera", "la_palma", "el_hierro"], "rios": ["mino", "sil", "ulla", "tambre", "eo", "navia", "nalon", "narcea", "besaya", "nervion", "bidasoa", "duero", "pisuerga", "arlanzon", "carrion", "esla", "bernesga", "eresma", "adaja", "tormes", "tajo", "jarama", "henares", "alberche", "tietar", "alagon", "almonte", "salor", "guadiana", "zancara", "ciguela", "jabalon", "zujar", "matachel", "guadalquivir", "guadalimar", "jandula", "guadalmellato", "guadiato", "bembezar", "viar", "guadianamenor", "guadalbullon", "genil", "odiel", "tinto", "guadalete", "barbate", "ter", "llobregat", "ebro", "jalon", "jiloca", "huerva", "guadalope", "arga", "aragon", "gallego", "cinca", "noguerapallaresa", "nogueraribagorzana", "segre", "mijares", "turia", "jucar", "cabriel", "segura", "almanzora", "andarax", "adra", "guadalfeo", "guadalhorce", "guadiaro"], "rel": ["meseta", "subnorte", "subsur", "sistemacentral", "somosierra", "guadarrama", "gredos", "almanzor", "gata_s", "estrella", "montestoledo", "guadalupe", "montanchez", "sanpedro", "montesleon", "teleno", "cantabrica", "ubina", "picoseuropa", "cerredo", "prieta", "iberico", "demanda", "urbion", "moncayo", "gudar", "javalambre", "maestrazgo", "albarracin", "universales", "cuenca", "morena", "aracena", "madrona", "alcaraz", "almenara", "galaico", "manzaneda", "vascos", "gorbea", "pirineos", "aneto", "perdido", "costerocat", "montseny", "montserrat", "montsant", "penibetica", "grazalema", "ronda", "torrecilla", "nevada", "mulhacen", "veleta", "filabres", "calaralto", "subbetica", "magina", "cazorla", "segura_s", "sagra", "tramuntana", "puigmajor", "levante", "teide"]};const HINT={"bares": "самая северная точка Испании", "touri": "самая западная точка материковой Испании", "tarifa": "самая южная точка материковой Испании", "gata": "юго-восточный «угол» полуострова; рядом Golfo de Almería", "creus": "самая восточная точка; разделяет Golfo de Roses и Golfo de León", "finis": "чуть южнее Туриньяна; «край земли» паломников", "orte": "западнее Estaca de Bares, почти рядом", "mulhacen": "высшая точка Пиренейского полуострова (Сьерра-Невада)", "teide": "высшая точка Испании (Тенерифе)", "aneto": "высшая точка Пиренеев", "cerredo": "высшая точка Кантабрийских гор (Пикос-де-Эуропа)", "almanzor": "высшая точка Системы Сентраль (Гредос)", "moncayo": "высшая точка Иберийской системы", "sil": "Сил течёт к Миньо", "narcea": "Нарсеа — приток Налона", "arlanzon": "Арлансон → Арланса → Писуэрга → Дуэро", "bernesga": "Бернесга → Эсла → Дуэро", "eresma": "Эресма → Адаха → Дуэро", "henares": "Энарес → Харама → Тахо", "zancara": "Санкара → Сигуэла → Гвадиана", "jiloca": "Хилока → Халон → Эбро", "arga": "Арга → Арагон → Эбро", "cinca": "Синка → Сегре → Эбро", "noguerapallaresa": "обе Ногеры → Сегре → Эбро", "nogueraribagorzana": "обе Ногеры → Сегре → Эбро", "cabriel": "Кабриэль → Хукар", "meseta": "Система Сентраль делит её на Северную и Южную субмесеты", "subnorte": "долина Дуэро", "subsur": "долины Тахо и Гвадианы", "montestoledo": "делят Южную субмесету: Тахо к северу, Гвадиана к югу"};const FROM={"duero": {"D": "с севера, с Кантабрийских и Леонских гор", "I": "с юга, с Системы Сентраль"}, "tajo": {"D": "с севера, с Системы Сентраль", "I": "с юга, с Монтес-де-Толедо"}, "guadiana": {"D": "с севера", "I": "с юга, со стороны Сьерра-Морены"}, "guadalquivir": {"D": "с севера, со Сьерра-Морены", "I": "с юга, с Бетических кордильер"}, "ebro": {"D": "с юга, с Иберийской системы", "I": "с севера, с Пиренеев"}};
function hintText(o){const a=[];if(HINT[o.id])a.push(HINT[o.id]);if(o.bank&&FROM[o.parent])a.push((o.bank==='D'?'Правый':'Левый')+' приток: течёт '+FROM[o.parent][o.bank]);return a.map(x=>x[0].toUpperCase()+x.slice(1)).join('. ')}
function hintHtml(o){const h=hintText(o);return h&&S.lang==='ru'?`<p class="hint">💡 ${h}</p>`:''}
function cards(){clearFx();const pool=active();if(!pool.length)return;cur=pick(pool,cur&&cur.id);highlight(cur);let shown=false;
 h(`<p class="prompt">${t('cardq')} ${scoreLine()}</p><button class="card" id="cd"><span class="cq">?</span><span class="sub">${t('flip')}</span></button><div class="row" id="cr"></div>`);
 $('#cd').onclick=()=>{if(shown)return;shown=true;$('#cd').innerHTML=`<span class="target">${cur.name}</span><span class="sub">${cur.ru}</span>${hintHtml(cur)}`;speak(cur.name);
  $('#cr').innerHTML=`<button class="btn" id="kn">✓ ${t('knew')}</button><button class="btn ghost" id="nk">✗ ${t('didnt')}</button>`;
  $('#kn').onclick=()=>{streak.n++;streak.ok++;grade(cur,true);cards()};$('#nk').onclick=()=>{streak.n++;grade(cur,false);cards()}};
 tapHandler=null}
let chainI={};
function chain(){clearFx();const act=new Set(active().map(o=>o.id));const seq=(SEQ[S.sec]||[]).filter(id=>BY[id]&&act.has(id));if(!seq.length){h(`<p class="sub">${t('none')}</p>`);return}
 const key=S.sec+'|'+seq.join(',');let i=chainI[key]||0;
 if(i>=seq.length){h(`<p class="target">${t('chaindone')}</p><div class="row"><button class="btn" id="rst">${t('restart')}</button></div>`);for(const id of seq)highlight(BY[id],'ok');$('#rst').onclick=()=>{chainI[key]=0;chain()};return}
 for(let k=0;k<i;k++)highlight(BY[seq[k]],'ok');
 const q=BY[seq[i]];let done=false;
 h(`<p class="prompt">${t('chainq')}: ${i+1} / ${seq.length} <span class="score">${streak.ok} / ${streak.n}</span></p><p class="target">${q.name}</p><div id="fb"></div><div class="row"><button class="btn ghost" id="rst">${t('restart')}</button></div>`);
 $('#rst').onclick=()=>{chainI[key]=0;chain()};
 tapHandler=(x,y)=>{if(done)return;done=true;const[o]=nearest(x,y,O.filter(inSec));const dt=dist(q,x,y);const ok=(o===q&&dt<u(140))||dt<6||own(q,x,y);
  if(o&&dist(o,x,y)<u(40))flash(o,ok?'ok':'bad');streak.n++;if(ok)streak.ok++;grade(q,ok);
  if(ok){chainI[key]=i+1;setTimeout(()=>S.mode==='chain'&&chain(),700)}
  else{highlight(q,'pulse');tagName(q);markTap(x,y,q);$('#fb').innerHTML=`<p class="fb bad">${t('far')}</p>${hintHtml(q)}<div class="row"><button class="btn" id="nx">${t('next')}</button></div>`;
   $('#nx').onclick=()=>{chainI[key]=i+1;chain()}}}}
function examIntro(){exam=null;h(`<p class="sub">${t('exam')}</p><div class="row"><button class="btn" id="st">${t('start')}</button></div>`);$('#st').onclick=examStart}
function examStart(){const pool=active().slice().sort(()=>Math.random()-.5);exam={qs:pool.slice(0,Math.min(20,pool.length)),i:0,res:[]};examQ()}
function examQ(){clearFx();const q=exam.qs[exam.i];
 h(`<p class="prompt">${t('q')} ${exam.i+1} ${t('of')} ${exam.qs.length}</p><p class="target">${q.name}</p><div class="bar"><i style="width:${exam.i/exam.qs.length*100}%"></i></div>`);
 tapHandler=(x,y)=>{const[o]=nearest(x,y,O.filter(inSec));if(o&&dist(o,x,y)<u(40))flash(o,'sel');const dt=dist(q,x,y);const ok=(o===q&&dt<u(140))||dt<6||own(q,x,y);exam.res.push({q,ok,x,y});grade(q,ok);
  exam.i++;if(exam.i<exam.qs.length)examQ();else examEnd()}}
function examEnd(){tapHandler=null;clearFx();const n=exam.res.filter(r=>r.ok).length,tot=exam.res.length;const g=Math.round(n/tot*100)/10;
 const errs=exam.res.filter(r=>!r.ok);errs.forEach(r=>{highlight(r.q,'ok');tagName(r.q);markTap(r.x,r.y,r.q)});
 h(`<p class="prompt">${t('grade')}</p><p class="target">${g.toLocaleString(S.lang)} / 10</p><p class="sub">${n} / ${tot}</p>
 <p class="sub">${errs.length?t('errs')+' '+errs.map(r=>r.q.name).join(', '):t('noerr')}</p><div class="row"><button class="btn" id="ag">${t('again')}</button></div>`);
 $('#ag').onclick=examStart}

function prog(){const rows=CATS.filter(c=>c.sec===S.sec).map(c=>{const os=O.filter(o=>o.cat===c.id);const l=os.filter(o=>(box[o.id]||0)>=3).length;
  return `<div><div class="h"><span>${c[S.lang]}</span><span class="score">${l} / ${os.length} ${t('learned')}</span></div><div class="bar"><i style="width:${l/os.length*100}%"></i></div></div>`}).join('');
 const weak=O.filter(o=>inSec(o)&&box[o.id]!==undefined&&(box[o.id]||0)<2).map(o=>o.name);
 h(`<div class="prog">${rows}</div>${weak.length?`<p class="weak">${t('weak')} ${weak.join(', ')}</p>`:''}<div class="row">${weak.length?`<button class="btn" id="wk">${t('weakbtn')} (${weak.length})</button>`:''}<button class="btn ghost" id="rs">${t('reset')}</button></div>`);
 if($('#wk'))$('#wk').onclick=()=>go('weak');
 $('#rs').onclick=()=>{if(confirm(t('confirm'))){box={};LS.set('box',box);prog()}}}

const DLS=[['dlpdf','dlt','dl','pdf/mapa-mudo-espana-fisica.pdf','mapa-mudo-espana-fisica.pdf'],['dlign','dlt2','dl2','pdf/IGN_Mapa_fisico_Espana_2025.pdf','IGN_Mapa_fisico_Espana_2025.pdf']];
$('#dlmenu').hidden=false;
$('#dlmenu').onclick=()=>{const o=$('#dlopts');o.hidden=!o.hidden;$('#dlmenu').setAttribute('aria-expanded',!o.hidden)};
for(const [bid,lid,key,url,fname] of DLS){$('#'+bid).onclick=()=>{const a=document.createElement('a');a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();const lab=$('#'+lid);lab.textContent=t('dlok');setTimeout(()=>{lab.textContent=t(key)},2500)}}
renderChrome();requestAnimationFrame(()=>{fitHome();go('study')});
</script>
