<!doctype html>
<html lang="es" data-theme="light" style="color-scheme:light">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa físico de Europa</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>

:root{--sea:#cfe1e8;--sea2:#bcd5df;--land:#fffefb;--other:#e4e2dc;--ink:#1f3a4d;--ink2:#5b7282;--line:#2c4c63;
--bg:#f6f8f9;--panel:#ffffff;--soft:#eef2f4;--hi:#f2a516;--ok:#2f8f5b;--bad:#d1432f;color-scheme:light}
html{height:100%}*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.app{display:grid;min-height:100%;grid-template-rows:auto auto auto auto;max-width:1400px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px 6px}
h1{order:3;flex:0 0 100%;margin:0;font-size:1.35rem;font-weight:800;letter-spacing:-.01em}
.home{order:1;flex:none;color:var(--ink2);text-decoration:none;font-size:.85rem;font-weight:600;border:1.5px solid var(--ink2);border-radius:99px;padding:3px 10px}
.lang{order:2;margin-left:auto;display:flex;border:1.5px solid var(--ink2);border-radius:99px;overflow:hidden;flex:none}
.lang button{border:0;background:none;padding:3px 10px;font-size:.8rem;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.controls{padding:0 16px 8px;display:grid;gap:8px;min-width:0}
.dl{display:inline-flex;align-items:center;gap:6px;justify-self:start;text-decoration:none;border-radius:12px;padding:7px 12px;font-size:.85rem;font-weight:600;background:var(--soft);color:var(--ink)}
.secs{display:flex;gap:6px}
.secs button{flex:1;min-width:0;border:1.5px solid var(--ink);background:none;border-radius:12px;padding:7px 4px;font-weight:700;cursor:pointer;font-size:.9rem}
.secs button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.modes{display:flex;flex-wrap:wrap;gap:4px;background:var(--soft);padding:4px;border-radius:14px}
.modes button{flex:1 1 auto;border:0;background:none;padding:8px 2px;border-radius:10px;font-size:.82rem;font-weight:600;cursor:pointer;white-space:nowrap}
.modes button[aria-pressed=true]{background:var(--panel);box-shadow:0 0 0 1px var(--sea2)}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.chip{flex:none;border:1.5px solid var(--ink2);background:none;border-radius:99px;padding:4px 11px;font-size:.82rem;cursor:pointer;color:var(--ink2)}
.chip[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.mapwrap{order:4;position:relative;height:min(58vh,560px);margin:0 8px;border-radius:18px;overflow:hidden;background:var(--sea);touch-action:none}
svg#map{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none;cursor:crosshair}
.zoom{position:absolute;right:10px;top:10px;display:grid;gap:6px}
.zoom button{width:38px;height:38px;border-radius:12px;border:0;background:var(--panel);color:var(--ink);font-size:1.2rem;cursor:pointer;box-shadow:0 0 0 1px var(--sea2)}
.attr{position:absolute;right:8px;bottom:6px;font-size:.66rem;color:var(--ink2);background:rgba(255,255,255,.8);padding:2px 6px;border-radius:6px}
.panel{order:3;padding:6px 16px 10px;min-height:0}
.app{display:flex;flex-direction:column}
@media (max-width:899px){.cats{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}.cats::-webkit-scrollbar{display:none}.src{display:none}}
.prompt{font-size:.82rem;color:var(--ink2);margin:0 0 2px}
.target{font-size:1.6rem;font-weight:800;letter-spacing:-.015em;margin:0;line-height:1.15}
.sub{color:var(--ink2);font-size:.92rem;margin:4px 0 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--ink);color:var(--bg)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opts button{border:1.5px solid var(--sea2);background:var(--panel);border-radius:12px;padding:10px 8px;cursor:pointer;font-weight:600;text-align:left}
.opts button.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--panel))}
.opts button.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--panel))}
input.ans{flex:1;min-width:0;font:inherit;font-size:1.1rem;padding:10px 12px;border-radius:12px;border:1.5px solid var(--sea2);background:var(--panel);color:var(--ink)}
.fb{font-weight:700;margin:8px 0 0}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.score{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:.85rem}
.bar{height:8px;border-radius:9px;background:var(--soft);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--ok);border-radius:9px}
.prog{display:grid;gap:10px;margin-top:8px}.prog .h{display:flex;justify-content:space-between;font-size:.9rem}
.card{width:100%;min-height:96px;margin-top:8px;border:1.5px solid var(--sea2);border-radius:16px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;padding:12px}
.cq{font-size:2.4rem;font-weight:800;color:var(--ink2);line-height:1}
.info{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin-top:8px;font-size:.95rem}.info b{color:var(--ink2);font-weight:600}
.note{font-size:.88rem;margin:8px 0 0;padding:6px 10px;border-radius:10px;background:color-mix(in srgb,var(--hi) 16%,var(--panel))}
.ru{color:#6a4fa3}
.toggle{display:flex;gap:6px;align-items:center;font-size:.85rem;color:var(--ink2);cursor:pointer}
.src{font-size:.74rem;color:var(--ink2);margin:14px 0 0;line-height:1.35}
.errs{margin:8px 0 0;padding-left:18px;font-size:.9rem}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
/* map */
.sea{fill:var(--sea)}
.grat{fill:none;stroke:var(--ink2);stroke-opacity:.16;stroke-width:.6;vector-effect:non-scaling-stroke}
.oth{fill:var(--other);stroke:#c9c6bd;stroke-width:.6;vector-effect:non-scaling-stroke}
.c{fill:var(--land);stroke:var(--line);stroke-width:.9;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.c.dim{fill:#f1efe9}
.c.hi{fill:var(--hi)}.c.ok{fill:#9fd3b2}.c.bad{fill:#f2b0a6}.c.sel{fill:#cdbdff}
.lake{fill:var(--sea);stroke:var(--line);stroke-width:.4;vector-effect:non-scaling-stroke}
.micro{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:2 2;vector-effect:non-scaling-stroke}
.micro.hi{stroke:var(--hi);stroke-width:3;stroke-dasharray:none}.micro.ok{stroke:var(--ok);stroke-width:3;stroke-dasharray:none}
.cap{fill:var(--line);stroke:#fff;vector-effect:non-scaling-stroke}
.cap.dim{fill:#9aa9b4}
.ring{fill:none;stroke:var(--hi);stroke-width:3;vector-effect:non-scaling-stroke}.ring.ok{stroke:var(--ok)}
@media (prefers-reduced-motion:no-preference){.ring.pulse{animation:pulse 1.3s ease-out infinite}}
@keyframes pulse{0%{stroke-opacity:1}100%{stroke-opacity:.25}}
.tap{fill:var(--bad)}.tapline{stroke:var(--bad);stroke-width:1.5;stroke-dasharray:4 3;vector-effect:non-scaling-stroke}
.lbl{fill:var(--line);paint-order:stroke;stroke:#fff;stroke-linejoin:round;font-weight:700;pointer-events:none}
.lbl.capl{font-weight:600;fill:#7a2e2e}
.lbl.sealbl{fill:#3d6f94;font-style:italic;font-weight:400;stroke:var(--sea)}
.lbl.tag{fill:#1f2a33;font-weight:800}
@media (min-width:900px){
 .app{display:grid;grid-template-columns:390px 1fr;grid-template-rows:auto auto 1fr;column-gap:8px;height:100%}
 header{grid-column:1}.controls{grid-column:1}.panel{grid-column:1;grid-row:3;overflow:auto}
 .mapwrap{grid-column:2;grid-row:1/4;margin:12px 12px 12px 0;height:auto;min-height:0}
 .target{font-size:2rem}
}

/* físico */
.coast{fill:none;stroke:#2c4c63;stroke-width:.8;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.landfill{fill:#fffefb}
.bord{fill:none;stroke:#6f6a60;stroke-opacity:.35;stroke-width:.6;stroke-dasharray:3 2;vector-effect:non-scaling-stroke}
.lakebg{fill:#bcd8e6;stroke:#3d86b8;stroke-width:.5;vector-effect:non-scaling-stroke}
.riv{fill:none;stroke:#3d86b8;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
svg.sec-rios .riv{stroke-width:2.2}
.zone{fill:none;stroke:none;vector-effect:non-scaling-stroke}
svg.study.sec-costa .zone.sea{stroke:#2c6f9c;stroke-opacity:.35;stroke-width:.8;stroke-dasharray:4 3}
svg.study.sec-rel .zone.rel{fill:#8a5a2b;fill-opacity:.12;stroke:#8a5a2b;stroke-opacity:.5;stroke-width:.8;stroke-dasharray:4 3}
svg.study.sec-costa .zone.pen{stroke:#7a6a40;stroke-opacity:.35;stroke-width:.8;stroke-dasharray:2 3}
.areac{fill:#3d86b8;fill-opacity:.08;stroke:#2c6f9c;stroke-opacity:.55;stroke-width:.8;stroke-dasharray:3 3;vector-effect:non-scaling-stroke}
.pt{fill:#2c4c63;stroke:#fff;vector-effect:non-scaling-stroke}
.hiz{fill:var(--hi);fill-opacity:.45;stroke:var(--hi);stroke-width:2;vector-effect:non-scaling-stroke}
.hiz.ok{fill:var(--ok);stroke:var(--ok)}.hiz.bad{fill:var(--bad);stroke:var(--bad)}.hiz.sel{fill:#7b5cff;stroke:#7b5cff;fill-opacity:.3}
.hil{fill:none;stroke:var(--hi);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-opacity:.9;vector-effect:non-scaling-stroke}
.hil.ok{stroke:var(--ok)}.hil.bad{stroke:var(--bad)}.hil.sel{stroke:#7b5cff}
.lbl.sea2{fill:#2a6f9e;font-style:italic;font-weight:600}
.lbl.riv2{fill:#1f5f8c;font-style:italic;font-weight:600}
.lbl.rel2{fill:#6b3f17;font-weight:800;letter-spacing:.04em}
.lbl.pen2{fill:#5a4a20;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.hyleg{position:absolute;left:8px;bottom:6px;background:rgba(255,255,255,.88);border-radius:8px;padding:4px 6px;font-size:.66rem;color:var(--ink2);display:none}
.hyleg i{display:inline-block;width:22px;height:9px;vertical-align:-1px}
.hyleg.on{display:block}
.zoom button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
</style>
</head>

const HOME={x:-4,y:-4,w:G.W+8,h:G.H+8};let vb={...HOME};
function fitHome(){const r=wrap.getBoundingClientRect();if(!r.width)return;const ar=r.width/r.height,mar=HOME.w/HOME.h;
 if(ar>mar){const w=HOME.h*ar;vb={x:HOME.x-(w-HOME.w)/2,y:HOME.y,w,h:HOME.h}}else{const h=HOME.w/ar;vb={x:HOME.x,y:HOME.y-(h-HOME.h)/2,w:HOME.w,h}
  if(ar<0.95){const w=HOME.w*0.66,h2=w/ar;vb={x:300-w/2,y:Math.max(-4,590-h2/2),w,h:h2}}}
 apply()}
function apply(){svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);scaleUI()}
const ppu=()=>wrap.getBoundingClientRect().width/vb.w,u=px=>px/ppu();
function zoomAt(f,cx,cy){const nw=Math.max(25,Math.min(vb.w*f,HOME.w*1.4));const k=nw/vb.w;vb.x=cx-(cx-vb.x)*k;vb.y=cy-(cy-vb.y)*k;vb.h*=k;vb.w=nw;apply()}
function toMap(cx,cy){const r=wrap.getBoundingClientRect();return[vb.x+(cx-r.left)/r.width*vb.w,vb.y+(cy-r.top)/r.height*vb.h]}
const ptrs=new Map();let drag=null,moved=0,pinch=null;
svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);moved=0;
 if(ptrs.size===1)drag={x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y};
 if(ptrs.size===2){const[a,b]=[...ptrs.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),w:vb.w,c:toMap((a[0]+b[0])/2,(a[1]+b[1])/2)};drag=null;moved=99}});
svg.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,[e.clientX,e.clientY]);
 if(pinch&&ptrs.size===2){const[a,b]=[...ptrs.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);const nw=Math.max(25,Math.min(pinch.w*pinch.d/d,HOME.w*1.4));const k=nw/vb.w;const[cx,cy]=pinch.c;vb.x=cx-(cx-vb.x)*k;vb.y=cy-(cy-vb.y)*k;vb.h*=k;vb.w=nw;apply();return}
 if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;moved=Math.max(moved,Math.abs(dx)+Math.abs(dy));if(moved>6){const k=vb.w/wrap.getBoundingClientRect().width;vb.x=drag.vx-dx*k;vb.y=drag.vy-dy*k;apply()}}});
const up=e=>{const was=ptrs.size;ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(was===1&&drag&&moved<=6){const[x,y]=toMap(e.clientX,e.clientY);onTap(x,y)}if(!ptrs.size)drag=null};
svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);pinch=null;drag=null});
svg.addEventListener('wheel',e=>{e.preventDefault();const[x,y]=toMap(e.clientX,e.clientY);zoomAt(e.deltaY>0?1.2:1/1.2,x,y)},{passive:false});

/* ---------- distancias ---------- */
function inPath(p,x,y){try{return p.isPointInFill(new DOMPoint(x,y))}catch(e){const q=svg.createSVGPoint();q.x=x;q.y=y;return p.isPointInFill(q)}}
function segD(x,y,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],L=dx*dx+dy*dy;let tt=L?((x-a[0])*dx+(y-a[1])*dy)/L:0;tt=Math.max(0,Math.min(1,tt));return Math.hypot(a[0]+tt*dx-x,a[1]+tt*dy-y)}
function dist(o,x,y){
 if(o.k==='pt')return Math.hypot(o.xy[0]-x,o.xy[1]-y);
 if(o.k==='area')return Math.max(0,Math.hypot(o.xy[0]-x,o.xy[1]-y)-o.r);
 if(o.k==='line'){let m=1e9;for(const l of o.lines)for(let i=1;i<l.length;i++)m=Math.min(m,segD(x,y,l[i-1],l[i]));return m}
 const[a,b,c,e]=o.bb;const pad=u(30);if(x<a-pad||x>c+pad||y<b-pad||y>e+pad)return 1e6;
 if(inPath(ZP[o.id],x,y))return 0;let m=1e9;for(const p of o.vx)m=Math.min(m,Math.hypot(p[0]-x,p[1]-y));return m}
const TOL={pt:18,area:10,line:12,zone:6,isl:10,lake:10};
function own(o,x,y){return dist(o,x,y)<u(TOL[o.k])}
function nearest(x,y,pool){let best=null,bd=1e9,bs=1e18;for(const o of pool){const d=dist(o,x,y);const sz=o.size||0;
  // a igual distancia (por ejemplo, dentro de dos zonas) gana la más pequeña: Peloponeso antes que la península Balcánica
  if(d<bd-1e-9||(Math.abs(d-bd)<1e-9&&sz<bs)){bd=d;best=o;bs=sz}}return[best,bd]}
const near=(o,x,y)=>dist(o,x,y)<u(40);

 if(o.k==='pt'){el('circle',{cx:o.xy[0],cy:o.xy[1],class:'ring '+(cls==='ok'?'ok':'pulse'),'data-r':12},gFx);scaleUI();return}
 if(o.k==='area'){el('circle',{cx:o.xy[0],cy:o.xy[1],r:o.r,class:'hiz '+cls},gHi);el('circle',{cx:o.xy[0],cy:o.xy[1],class:'ring '+(cls==='ok'?'ok':'pulse'),'data-r':16},gFx);scaleUI();return}
 el('path',{d:o.d,class:'hiz '+cls},gHi);if(o.size<300){const[x,y]=o.lab;el('circle',{cx:x,cy:y,class:'ring '+(cls==='ok'?'ok':'pulse'),'data-r':20},gFx);scaleUI()}}
function tag(o){const[x,y]=o.lab;const tx=el('text',{x,y,class:'lbl tag','text-anchor':'middle','data-fs':13,'data-dy':-10},gFx);tx.textContent=o.es;scaleUI()}
function nearPt(o,x,y){if(o.k==='pt'||o.k==='area')return o.xy;let best=o.lab,bd=1e9;const pts=o.k==='line'?o.lines.flat():o.vx;for(const p of pts){const d=Math.hypot(p[0]-x,p[1]-y);if(d<bd){bd=d;best=p}}return best}
function tapMark(x,y,o){const[ax,ay]=nearPt(o,x,y);el('line',{x1:x,y1:y,x2:ax,y2:ay,class:'tapline'},gFx);el('circle',{cx:x,cy:y,class:'tap','data-r':5},gFx);scaleUI()}

const inSec=o=>o.sec===S.sec;
function active(){return O.filter(o=>inSec(o)&&S.cats.includes(o.cat))}
let deck=null;
function pick(p,avoid){const k=S.mode+'|'+S.sec+'|'+p.map(o=>o.id).join(',');
 if(!deck||deck.key!==k||!deck.q.length){const ids=p.map(o=>o.id);for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}
  ids.sort((a,b)=>Math.min(box[a]||0,3)-Math.min(box[b]||0,3));if(ids.length>1&&ids[0]===avoid)ids.push(ids.shift());
  deck={key:k,q:ids,total:ids.length,seen:new Set(),round:deck&&deck.key===k?deck.round+1:1}}
 const id=deck.q.shift();deck.seen.add(id);return BY[id]}
function grade(o,ok){if(!ok&&deck&&S.mode!=='exam'&&!deck.q.includes(o.id))deck.q.splice(Math.min(3,deck.q.length),0,o.id);box[o.id]=ok?Math.min(5,(box[o.id]||0)+1):Math.max(0,(box[o.id]||0)-2);LS.set('euf_box',box)}

const updScore=()=>{const s=$('#sc');if(s)s.textContent=`${streak.ok} / ${streak.n}`};
const norm=s=>s.toLowerCase().trim().replace(/\s+/g,' '),strip=s=>norm(s).normalize('NFD').replace(/[̀-ͯ]/g,'');

  $('#ck').onclick=sub;$('#ans').onkeydown=e=>{if(e.key==='Enter')sub()};setTimeout(()=>$('#ans')&&$('#ans').focus({preventScroll:true}),50)}
 else{let same=O.filter(o=>o.cat===cur.cat&&o!==cur);if(same.length<3)same=same.concat(O.filter(o=>o.sec===cur.sec&&o.cat!==cur.cat&&o!==cur));
